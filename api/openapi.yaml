openapi: 3.1.0

info:
  title: Marketplace API
  version: 0.1.0
  description: |
    Video-first local marketplace — GCC.

    **This file is the source of truth.** The Go server interfaces and the TypeScript
    client are both generated from it. Do not hand-edit anything under
    `services/api/internal/gen/` or `packages/api-client/src/gen/`; CI fails the build
    if regenerating produces a diff.

    Conventions:
      - Money is always an integer in **minor units** plus an ISO-4217 currency code.
        There are no floats in this API.
      - Every mutating endpoint accepts `Idempotency-Key`. Mobile networks retry;
        double-charging is unrecoverable.
      - Timestamps are RFC 3339 with offset. Calendar dates carrying no time are
        `format: date` and are interpreted in the branch's timezone.

servers:
  - url: http://localhost:8080/v1
    description: Local
  - url: https://api.staging.example.ae/v1
    description: Staging

tags:
  - name: health
  - name: auth
  - name: me
  - name: catalog
  - name: availability
  - name: orders
  - name: reels
  - name: feed
  - name: events
  - name: moderation
  - name: actions
  - name: social
  - name: analytics

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- health --
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness — process is up
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness — dependencies reachable
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ------------------------------------------------------------------ auth --
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a one-time code to a phone number
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: Code dispatched (response is identical whether or not the number exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Exchange a one-time code for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerification" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session, or all sessions for this user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------------------- me --
  /me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/addresses:
    get:
      tags: [me]
      operationId: listAddresses
      summary: The user's saved addresses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      operationId: createAddress
      summary: Save an address
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # --------------------------------------------------------------- catalog --
  /vendors/{vendorId}:
    get:
      tags: [catalog]
      operationId: getVendor
      summary: Public vendor profile
      security: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/offerings:
    get:
      tags: [catalog]
      operationId: listOfferings
      summary: Bookable offerings at a branch
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: service_type
          in: query
          required: false
          description: Filter by service type key, e.g. `laundry_wash_fold`.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceOffering" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- availability --
  /branches/{branchId}/availability:
    get:
      tags: [availability]
      operationId: getAvailability
      summary: Remaining capacity per day and time window
      description: |
        Returns only windows with remaining capacity. A window absent from the response
        is either full, closed, or outside the branch's operating calendar — the client
        must not distinguish between those cases.
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: resource_key
          in: query
          required: true
          description: Capacity resource being consumed, e.g. `pickup_slot`, `kitchen_covers`.
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Inclusive. At most 31 days after `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvailabilityDay" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- orders --
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: The user's orders, newest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor:
                    type: [string, "null"]
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order
      description: |
        Reserves capacity, materialises fulfillments, and produces a price quote in
        `estimated` state. No money moves here — payment authorization is a separate
        call so that a failed card does not orphan a capacity reservation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Capacity for the requested window was exhausted between quote and submit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: One order with its fulfillments and quote
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{orderId}/payment-intent:
    post:
      tags: [orders]
      operationId: createPaymentIntent
      summary: Authorize payment for an order
      description: |
        Moves the quote `estimated → authorized`. Returns the gateway client secret;
        the app completes 3DS with the gateway SDK directly and the platform learns
        the outcome by webhook, never by trusting the client.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Quote is not in a state that can be authorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ----------------------------------------------------------------- reels --
  /reels/uploads:
    post:
      tags: [reels]
      operationId: createReelUpload
      summary: Reserve a reel and get a presigned upload URL
      description: |
        Creates a `draft` reel and returns a presigned `PUT` for the raw video.

        **The client uploads directly to object storage.** Bytes never pass through
        this API: a 30–60s reel is 10–30 MB, and proxying it would pin a request
        goroutine and a connection for the duration of a mobile upload.

        Send the returned `upload_headers` verbatim on the PUT. A presigned URL signs
        the headers it was created with, so omitting `Content-Type` produces a
        signature mismatch that looks like an auth failure and is not one.

        The upload and the metadata call (`POST /reels/{reelId}`) are independent and
        may complete in either order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: string
                  format: uuid
                  description: The branch this reel is authored by. The caller must be a member of its vendor.
                content_type:
                  type: string
                  enum: [video/mp4, video/quicktime, video/webm]
                  default: video/mp4
                subject_type: { type: [string, "null"], enum: [service_offering, meal_plan, vehicle_listing, null] }
                subject_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelUpload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /reels/{reelId}:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [reels]
      operationId: updateReel
      summary: Set caption, tags, category and visibility
      description: |
        Idempotent, and may arrive before or after the upload finishes.

        Refused once moderation has begun. Editing a caption after it has passed
        review would let clean text be swapped for dirty text post-approval.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReelMetadata" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorReel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Metadata can no longer be changed at this state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      tags: [reels]
      operationId: getReel
      summary: Author-visible state, including the rejection reason
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorReel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [reels]
      operationId: deleteReel
      summary: Take the reel down
      description: |
        Moves the reel to `removed` and drops it from the feed. The row, its state
        history and its moderation record are kept — they are the evidence when the
        decision is disputed.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reels/{reelId}/report:
    post:
      tags: [reels]
      operationId: reportReel
      summary: Report a reel for policy violation
      description: |
        One report per person per reel. Returns 202 whether or not this reporter has
        already reported it — telling a reporter their duplicate was rejected reveals
        nothing useful and invites them to try again with another account.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [sexual, violence, hate, misleading, spam, illegal, other]
                detail: { type: string, maxLength: 1000 }
      responses:
        "202":
          description: Report received
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [received] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ feed --
  /feed:
    get:
      tags: [feed]
      operationId: getFeed
      summary: The local video feed
      description: |
        Chronological in Phase 2; ranked from Phase 4. The cursor format does not
        change between them, so a client holding a cursor across that deploy keeps
        working.

        `lat` and `lng` are **required**. The product is local discovery; a feed
        without a location is a different product. Only reels whose resolved coverage
        geometry contains the point are returned.

        Authentication is optional. A signed-in viewer additionally gets block
        filtering and a durable seen-set; an anonymous one is keyed by `X-Device-Id`.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: category
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: X-Device-Id
          in: header
          required: false
          description: Namespaces the seen-set for anonymous viewers.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- events --
  /events:
    post:
      tags: [events]
      operationId: submitEvents
      summary: Batched client engagement events
      description: |
        The client batches and POSTs roughly every 10 seconds or on app background.
        One request per event would turn a 30-second viewing session into a dozen
        requests per user.

        Ingest is idempotent: a client that loses its connection mid-POST resends the
        whole batch, and without deduplication every flaky network would inflate the
        view count.

        A **view** is ≥2 seconds watched, deduped per (user, reel, session). Send
        `watched_ms` and let the server apply that definition — it is also what the
        Phase 4 ranking model trains on, and two definitions of the same word is how
        a model learns the wrong thing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                session_id: { type: string, maxLength: 128 }
                events:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ClientEvent" }
      responses:
        "202": { description: Accepted }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ------------------------------------------------------------ moderation --
  /moderation/queue:
    get:
      tags: [moderation]
      operationId: getModerationQueue
      summary: Reels awaiting human review, oldest first
      description: |
        Oldest-first, never by severity: the queue exists to meet a two-hour SLA, and
        any ordering that lets an item be overtaken lets one item sit forever.

        Requires platform staff membership, checked against the database on every
        call rather than carried as a token claim — revoking a moderator has to take
        effect immediately.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ModerationQueueItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/{reelId}/decide:
    post:
      tags: [moderation]
      operationId: decideModeration
      summary: Approve or reject a reel awaiting review
      description: |
        A moderator decides approve or reject. `review` is not accepted — that is
        where the reel already is.

        Approval moves the reel to `approved`, not `published`: publication still
        needs coverage geometry resolved, and folding the two together would let a
        click publish a reel with no audience.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes:
                  type: string
                  description: Shown to the author on rejection. Be specific enough to act on.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [recorded] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Reel is not awaiting review
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # --------------------------------------------------------------- actions --
  /reels/{reelId}/actions:
    put:
      tags: [actions]
      operationId: setReelActions
      summary: Set a reel's call-to-action buttons
      description: |
        Replaces the whole list. Position is implied by array order; index 0 is the
        primary CTA and is the one that gets pressed.

        Refused once moderation has begun, for two reasons. A CTA swapped after
        approval means the reviewed content and the live destination are different
        things — the oldest trick in content moderation. And repointing a published
        reel's CTA would silently reassign its accumulated click history to a new
        target, corrupting the funnel retroactively.

        A CTA whose `(kind, target_type)` pair has no registered handler is rejected
        here rather than stored. Otherwise the failure surfaces weeks later as a
        greyed-out button in the feed, which everyone reads as a feed bug.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  maxItems: 3
                  description: |
                    At most three. Not a storage limit — a product one: a reel with
                    six buttons has no primary call to action, and attribution
                    credits one action, so spreading intent across six makes every
                    one of them look weak.
                  items: { $ref: "#/components/schemas/ActionInput" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Actions are fixed once moderation has begun
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /actions/{actionId}/click:
    post:
      tags: [actions]
      operationId: clickAction
      summary: Record a CTA press and get the route
      description: |
        Recording and routing are the same call deliberately. If the client routed
        itself and reported the click separately, every dropped analytics request
        would be a conversion the server never saw — and those drops are not random,
        they cluster in exactly the bad-network conditions where conversion is
        already lowest. Coupling them means the number cannot quietly under-count.

        The click is recorded even when the CTA resolves unavailable. A viewer
        pressing "Book" on a fully-booked branch is demand, and it is the most
        actionable signal a vendor will get — dropping it because the outcome failed
        would hide a capacity problem behind a conversion one.

        Authentication is optional, but an identity is required: sign in, or send
        `X-Device-Id`. An anonymous viewer who clicks, signs up, and then orders is
        the feed doing the entire job including acquisition, and that path is only
        visible if the click carried a key that survives the sign-up.
      security: []
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Device-Id
          in: header
          required: false
          description: Required when not authenticated.
          schema: { type: string }
        - name: lat
          in: query
          required: false
          schema: { type: number }
        - name: lng
          in: query
          required: false
          schema: { type: number }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string, maxLength: 128 }
                surface:
                  type: string
                  enum: [feed, profile, search, share_link, deep_link]
                  default: feed
                  description: |
                    A click from the feed and one from a shared link are not the same
                    event. Attribution treats everything but `feed` and `search` as
                    off-feed, so the feed's own number stays honest.
                watched_ms:
                  type: integer
                  description: A press at 400ms is a mis-tap; one at 12s is intent.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedAction" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- social --
  /me/follows:
    post:
      tags: [social]
      operationId: follow
      summary: Follow a vendor, branch or creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [followee_type, followee_id]
              properties:
                followee_type: { type: string, enum: [vendor, vendor_branch, user] }
                followee_id: { type: string, format: uuid }
      responses:
        "204": { description: Followed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/follows/{followeeId}:
    delete:
      tags: [social]
      operationId: unfollow
      summary: Unfollow
      parameters:
        - name: followeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [vendor, vendor_branch, user], default: vendor_branch }
      responses:
        "204": { description: Unfollowed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reels/{reelId}/save:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [social]
      operationId: saveReel
      summary: Save a reel
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [social]
      operationId: unsaveReel
      summary: Remove a saved reel
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------- analytics --
  /reels/{reelId}/funnel:
    get:
      tags: [analytics]
      operationId: getReelFunnel
      summary: One reel's conversion funnel
      description: |
        Scoped to the reel's author.

        There is deliberately no single `conversion_rate` field. The available
        denominators differ by an order of magnitude — orders ÷ clicks flatters
        roughly tenfold against orders ÷ impressions — so every rate is returned
        named for its denominator, and orders are split by attribution model rather
        than summed.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelFunnel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /analytics/feed-funnel:
    get:
      tags: [analytics]
      operationId: getFeedFunnel
      summary: Platform-wide conversion — does the feed produce bookings?
      description: |
        The number Phase 3 exists to produce, and the one the decision to keep
        investing in video rests on.

        Staff-only. Not because it is sensitive, but because it must not circulate
        stripped of the `definitions` block that makes it interpretable: the same
        raw counts support a flattering reading and a conservative one, and the
        response carries the definitions so both parties are quoting the same thing.

        `feed_share_of_orders` is verifiable click-attributed orders over *all*
        orders placed, including organic. It is the conservative reading on purpose.
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedFunnel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID. Replaying a key with an identical request body returns
        the original response; replaying it with a different body is a 422.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      required: false
      description: Inclusive. Defaults to 30 days ago.
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: false
      description: Inclusive of the named day. Defaults to today.
      schema: { type: string, format: date }

  responses:
    Unauthorized:
      description: Missing, expired or revoked credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Authenticated, but not permitted. Distinct from 404 on purpose where the
        caller already knows the resource exists — a vendor dashboard that gets a 404
        for a branch it just listed cannot tell a permissions problem from a bug.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource, or not visible to this caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Well-formed but semantically invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # RFC 9457 problem details. One error shape for the whole API.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          description: Field-level detail for validation failures.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }

    Money:
      type: object
      description: Integer minor units. `1250` + `AED` is 12.50 AED.
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3, examples: ["AED", "SAR"] }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Locale:
      type: string
      enum: [en, ar]

    # --- auth ---
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164, including country code.
          pattern: '^\+[1-9]\d{7,14}$'
          examples: ["+971501234567"]
        purpose: { type: string, enum: [login, verify_phone], default: login }
        locale: { $ref: "#/components/schemas/Locale" }

    OtpChallenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        resend_after_seconds: { type: integer }

    OtpVerification:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, minLength: 4, maxLength: 8 }
        device:
          type: object
          properties:
            platform: { type: string, enum: [ios, android, web] }
            name: { type: string }
            push_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, default: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, phone, locale, status, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: [string, "null"], format: email }
        display_name: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { type: string, format: date-time }

    # --- addresses ---
    AddressInput:
      type: object
      description: |
        GCC addressing is landmark-based. A postcode-driven form fails here — `landmark`
        carries more routing value than `street` in most of the region.
      required: [label, city, country, point]
      properties:
        label: { type: string, examples: ["Home", "Office"] }
        recipient_name: { type: string }
        recipient_phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        building: { type: string }
        flat: { type: string }
        street: { type: string }
        landmark: { type: string }
        area: { type: string, description: "District / community, e.g. Al Barsha 1." }
        city: { type: string }
        emirate: { type: string, description: "Emirate (UAE) or region (KSA)." }
        country: { type: string, minLength: 2, maxLength: 2, examples: ["AE", "SA"] }
        point: { $ref: "#/components/schemas/GeoPoint" }
        notes: { type: string }

    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            is_default: { type: boolean }
            created_at: { type: string, format: date-time }

    # --- catalog ---
    Vendor:
      type: object
      required: [id, slug, trade_name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        trade_name: { type: string }
        trade_name_ar: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, suspended] }
        rating: { type: [number, "null"] }
        rating_count: { type: integer }
        branches:
          type: array
          items: { $ref: "#/components/schemas/VendorBranch" }

    VendorBranch:
      type: object
      description: |
        Capacity, service areas and operating hours attach to the **branch**, not the
        vendor. A laundry chain has three facilities with independent catchments.
      required: [id, vendor_id, name, timezone]
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        timezone: { type: string, examples: ["Asia/Dubai"] }
        point: { $ref: "#/components/schemas/GeoPoint" }
        is_active: { type: boolean }

    ServiceOffering:
      type: object
      required: [id, branch_id, service_type, name, base_price, is_active]
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        service_type: { type: string, description: "Strategy registry key." }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        description: { type: [string, "null"] }
        base_price: { $ref: "#/components/schemas/Money" }
        price_is_estimate:
          type: boolean
          description: |
            True when the final amount is only known after handling — laundry priced by
            weight, for example. The client must show an estimate, not a total.
        lead_time_minutes: { type: integer }
        image_url: { type: [string, "null"], format: uri }
        is_active: { type: boolean }

    # --- availability ---
    AvailabilityDay:
      type: object
      required: [date, windows]
      properties:
        date: { type: string, format: date }
        windows:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityWindow" }

    AvailabilityWindow:
      type: object
      required: [window_id, starts_at, ends_at, remaining]
      properties:
        window_id: { type: string, format: uuid }
        starts_at: { type: string, description: "Local wall-clock HH:MM in the branch timezone.", examples: ["08:00"] }
        ends_at: { type: string, examples: ["10:00"] }
        remaining: { type: integer, minimum: 0 }
        surcharge:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    # --- orders ---
    OrderInput:
      type: object
      required: [branch_id, address_id, lines, schedule]
      properties:
        branch_id: { type: string, format: uuid }
        address_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [offering_id, quantity]
            properties:
              offering_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              options:
                type: object
                additionalProperties: true
                description: Vertical-specific selections, validated by the service type's strategy.
        schedule:
          type: object
          description: |
            One entry per fulfillment the vertical requires. A laundry order supplies
            two (pickup and delivery); a single-visit service supplies one. The count
            is validated against the service type's fulfillment pattern.
          required: [slots]
          properties:
            slots:
              type: array
              minItems: 1
              items:
                type: object
                required: [kind, date, window_id]
                properties:
                  kind: { type: string, enum: [pickup, delivery, visit] }
                  date: { type: string, format: date }
                  window_id: { type: string, format: uuid }
        notes: { type: string }
        source:
          type: object
          description: |
            Attribution. Present when the order originated from a reel — this is the
            conversion signal Phase 3 depends on, so the field exists from Phase 1
            even though nothing writes it yet.
          properties:
            reel_id: { type: [string, "null"], format: uuid }
            action_id: { type: [string, "null"], format: uuid }

    Order:
      type: object
      required: [id, order_no, status, branch_id, lines, fulfillments, quote, created_at]
      properties:
        id: { type: string, format: uuid }
        order_no: { type: string, examples: ["AE-2K7F4M"] }
        status:
          type: string
          enum: [pending_payment, confirmed, in_progress, completed, cancelled, failed]
        branch_id: { type: string, format: uuid }
        vendor: { $ref: "#/components/schemas/Vendor" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        fulfillments:
          type: array
          items: { $ref: "#/components/schemas/Fulfillment" }
        quote: { $ref: "#/components/schemas/PriceQuote" }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    OrderLine:
      type: object
      description: |
        Name and price are **snapshots** taken when the order was placed. Never render
        from the offering — a vendor's later price change must not rewrite history.
      required: [id, offering_id, name_snapshot, unit_price_snapshot, quantity]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        name_snapshot: { type: string }
        unit_price_snapshot: { $ref: "#/components/schemas/Money" }
        quantity: { type: integer }
        options:
          type: object
          additionalProperties: true

    Fulfillment:
      type: object
      description: |
        The atomic unit of physical work: someone goes somewhere at a time to do a
        thing. Logistics operates on this shape alone and never learns what a laundry
        or a meal is.
      required: [id, kind, status, scheduled_date, window]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pickup, delivery, visit] }
        status:
          type: string
          enum: [scheduled, dispatched, en_route, arrived, completed, failed, cancelled]
        sequence: { type: integer, description: "Ordering within the parent order, 1-based." }
        scheduled_date: { type: string, format: date }
        window: { $ref: "#/components/schemas/AvailabilityWindow" }
        address: { $ref: "#/components/schemas/Address" }
        completed_at: { type: [string, "null"], format: date-time }

    PriceQuote:
      type: object
      description: |
        Price is a state machine, not a column:
        `estimated → authorized → adjusted → captured → refunded`.
        Laundry priced by weight is `adjusted` after pickup — the model must carry that
        natively rather than treating it as an exception.
      required: [id, state, version, subtotal, tax_total, total]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [estimated, authorized, adjusted, captured, refunded, void] }
        version: { type: integer }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount_total: { $ref: "#/components/schemas/Money" }
        delivery_total: { $ref: "#/components/schemas/Money" }
        tax_total: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        tax_inclusive:
          type: boolean
          description: |
            True in GCC markets — displayed prices already contain VAT. `tax_total` is
            the extracted portion of `total`, not an addition to it.
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuoteLine" }

    QuoteLine:
      type: object
      required: [kind, label, amount]
      properties:
        kind: { type: string, enum: [item, delivery, surcharge, discount, tax] }
        label: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        tax_rate_bp:
          type: [integer, "null"]
          description: Basis points. 500 = 5% (UAE), 1500 = 15% (KSA).

    PaymentIntent:
      type: object
      required: [id, status, amount, provider]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requires_action, authorized, failed] }
        amount: { $ref: "#/components/schemas/Money" }
        provider: { type: string, examples: ["checkout", "stripe", "tap"] }
        client_secret: { type: [string, "null"] }
        redirect_url: { type: [string, "null"], format: uri }

    # ------------------------------------------------------------- Phase 2 --

    ReelUpload:
      type: object
      required: [reel_id, asset_id, upload_url, upload_headers, expires_at]
      properties:
        reel_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        upload_headers:
          type: object
          description: Send these verbatim on the PUT. They are part of the signature.
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    ReelState:
      type: string
      description: |
        The reel lifecycle. Transitions are enforced in one place server-side; a
        client should treat any state it does not recognise as "still processing".
      enum:
        - draft
        - uploaded
        - probing
        - transcoding
        - moderating
        - review_pending
        - approved
        - published
        - rejected
        - removed
        - failed
        - expired

    ReelMetadata:
      type: object
      properties:
        caption: { type: string, maxLength: 2200 }
        caption_locale: { type: string, enum: [ar, en, mixed] }
        category_id: { type: [string, "null"], format: uuid }
        tags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 64 }
        visibility: { type: string, enum: [public, unlisted, private], default: public }
        subject_type: { type: [string, "null"], enum: [service_offering, meal_plan, vehicle_listing, null] }
        subject_id: { type: [string, "null"], format: uuid }

    AuthorReel:
      type: object
      description: |
        The author's view. Carries the failure reason, which the feed representation
        deliberately does not — a rejected vendor who is told only "rejected" has no
        way to fix it, and that is the most common complaint about every content
        platform.
      required: [id, state, visibility]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ReelState" }
        visibility: { type: string, enum: [public, unlisted, private] }
        caption: { type: string }
        tags:
          type: array
          items: { type: string }
        poster_key: { type: [string, "null"] }
        preview_key: { type: [string, "null"] }
        lqip:
          type: [string, "null"]
          description: BlurHash or base64 micro-thumb, inline so the client paints before any fetch resolves.
        duration_ms: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        failure:
          type: [object, "null"]
          properties:
            code: { type: string }
            detail: { type: string }

    Rendition:
      type: object
      required: [label, width, height, bitrate_kbps, playlist_url]
      properties:
        label:
          type: string
          enum: ["360p", "540p", "720p"]
          description: Capped at 720p. 1080p roughly doubles egress for a difference nobody sees on a phone.
        width: { type: integer }
        height: { type: integer }
        bitrate_kbps: { type: integer }
        playlist_url: { type: string, format: uri }

    ReelCounters:
      type: object
      description: |
        Read from the hot store with a Postgres fallback, so they lag by up to the
        flush interval (~10s). Never treat them as transactionally consistent.
      properties:
        views: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
        saves: { type: integer, format: int64 }

    FeedItem:
      type: object
      required: [id, author, renditions, published_at]
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [vendor_branch, user] }
            id: { type: string, format: uuid }
            name: { type: string }
        subject_type: { type: [string, "null"] }
        subject_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid }
        caption: { type: string }
        duration_ms: { type: integer }
        poster_key: { type: string }
        preview_key: { type: string }
        lqip: { type: string }
        renditions:
          type: array
          items: { $ref: "#/components/schemas/Rendition" }
        counters: { $ref: "#/components/schemas/ReelCounters" }
        published_at: { type: string, format: date-time }

    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque. Keyset, never offset. Do not parse it — the tie-break field
            changes when ranking lands in Phase 4.

    ClientEvent:
      type: object
      required: [type, occurred_at]
      properties:
        type:
          type: string
          enum:
            - view_start
            - view_progress
            - like
            - unlike
            - comment
            - share
            - save
            - unsave
            - skip
            - action_click
        reel_id: { type: [string, "null"], format: uuid }
        occurred_at:
          type: string
          format: date-time
          description: Client clock. Kept alongside server receipt time so an offline backlog is visible.
        watched_ms:
          type: integer
          description: On view_progress. The server applies the ≥2000ms view definition.
        properties:
          type: object
          additionalProperties: true

    ModerationQueueItem:
      type: object
      required: [reel_id, entered_at]
      properties:
        reel_id: { type: string, format: uuid }
        author_type: { type: string, enum: [vendor_branch, user] }
        author_id: { type: string, format: uuid }
        caption: { type: string }
        poster_key: { type: string }
        categories:
          type: array
          items: { type: string }
        tier:
          type: string
          enum: [new, probation, trusted, flagged]
          description: Author trust tier. Drives how much of this author's content is reviewed at all.
        reports: { type: integer }
        entered_at: { type: string, format: date-time }
        waiting_seconds: { type: integer }
        sla_breached:
          type: boolean
          description: True past the two-hour review SLA. Surfaced here so a breach is visible in the tool the moderator already has open.

    # ------------------------------------------------------------- Phase 3 --

    ActionKind:
      type: string
      description: |
        The complete vocabulary the feed has for commerce. Adding a vertical means
        registering a kind and its handler — never touching feed, ranking or
        moderation code.
      enum:
        - book_service
        - subscribe_plan
        - inquire_listing
        - open_menu
        - follow
        - share
        - external

    ActionTargetType:
      type: string
      enum:
        - service_offering
        - meal_plan
        - vehicle_listing
        - vendor_branch
        - vendor
        - url

    ActionInput:
      type: object
      required: [kind, target_type]
      properties:
        kind: { $ref: "#/components/schemas/ActionKind" }
        target_type: { $ref: "#/components/schemas/ActionTargetType" }
        target_id:
          type: [string, "null"]
          format: uuid
          description: Required for every target type except `url`.
        target_url:
          type: [string, "null"]
          format: uri
          description: |
            Required when `target_type` is `url`. Only http and https are accepted —
            a CTA is a link a vendor supplies and a customer taps inside our app.
        label: { type: string, maxLength: 40 }
        label_ar: { type: string, maxLength: 40 }

    ResolvedAction:
      type: object
      description: |
        A CTA as the client renders it. `label`, `available` and `reason` come from
        the owning vertical's handler; the feed itself never learns what the target
        is.
      required: [id, kind, target_type, available]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActionKind" }
        target_type: { $ref: "#/components/schemas/ActionTargetType" }
        target_id: { type: string, format: uuid }
        position: { type: integer }
        label: { type: string }
        label_ar: { type: string }
        available: { type: boolean }
        reason:
          type: [string, "null"]
          description: |
            Shown when `available` is false. Always populated in that case — a
            greyed-out button with no explanation reads as a broken app, and the
            vendor gets blamed for a platform decision.
        route:
          type: string
          description: Client-side deep link, or an absolute URL for `external`.
        meta:
          type: [object, "null"]
          additionalProperties: true

    AttributionModel:
      type: string
      description: |
        Which rule credited an order to a reel. Stored per row, because the rules
        will change and a historical number is only interpretable under the rule
        that produced it.

        `last_click` is the only model backed by something the server observed.
        The others are reported beside it, never merged into it.
      enum:
        - last_click
        - declared
        - view_through
        - none

    AttributedOrders:
      type: object
      description: |
        Split by model and never summed into one "orders" figure. A view-through
        order and a click-through order are different claims about whether the feed
        works, and adding them asserts they are the same claim.
      properties:
        last_click: { type: integer, format: int64 }
        declared: { type: integer, format: int64 }
        view_through: { type: integer, format: int64 }
        organic: { type: integer, format: int64 }

    ReelFunnel:
      type: object
      required: [reel_id, impressions, views, clicks, orders]
      properties:
        reel_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        impressions:
          type: integer
          format: int64
          description: Times the reel was served in a feed page. The denominator egress is spent on.
        views:
          type: integer
          format: int64
          description: ≥2s watched, deduped per (user, reel, session).
        clicks: { type: integer, format: int64 }
        orders: { $ref: "#/components/schemas/AttributedOrders" }
        off_feed_orders:
          type: integer
          format: int64
          description: |
            Arrived by shared or deep link rather than the feed. Reported apart
            because a vendor pushing their own reel to a WhatsApp group converts at
            rates the feed will never approach.
        gmv_last_click_minor:
          type: integer
          format: int64
          description: Verifiable attributions only. A revenue figure nobody can defend is worse than none.
        currency: { type: string }
        rates:
          type: object
          description: Each named for its denominator, so the flattering one cannot be quoted by accident.
          properties:
            clicks_per_impression: { type: number }
            orders_per_click: { type: number }
            orders_per_impression: { type: number }

    FeedFunnel:
      type: object
      required: [impressions, clicks, orders, feed_share_of_orders, definitions]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        impressions: { type: integer, format: int64 }
        clicks: { type: integer, format: int64 }
        orders: { $ref: "#/components/schemas/AttributedOrders" }
        gmv_last_click_minor: { type: integer, format: int64 }
        gmv_total_minor: { type: integer, format: int64 }
        currency: { type: string }
        reels_with_impressions: { type: integer, format: int64 }
        reels_with_any_order: { type: integer, format: int64 }
        feed_share_of_orders:
          type: number
          description: |
            Verifiable click-attributed orders ÷ all orders placed, organic included.
            The conservative reading, computed server-side so everyone quotes the
            same definition.
        definitions:
          type: object
          description: |
            Shipped with the numbers, not in a wiki. The same raw counts support a
            flattering reading and a conservative one; carrying the definitions means
            both parties are arguing about the same thing.
          additionalProperties: true
