openapi: 3.1.0

info:
  title: Marketplace API
  version: 0.1.0
  description: |
    Video-first local marketplace — GCC.

    **This file is the source of truth.** The Go server interfaces and the TypeScript
    client are both generated from it. Do not hand-edit anything under
    `services/api/internal/gen/` or `packages/api-client/src/gen/`; CI fails the build
    if regenerating produces a diff.

    Conventions:
      - Money is always an integer in **minor units** plus an ISO-4217 currency code.
        There are no floats in this API.
      - Every mutating endpoint accepts `Idempotency-Key`. Mobile networks retry;
        double-charging is unrecoverable.
      - Timestamps are RFC 3339 with offset. Calendar dates carrying no time are
        `format: date` and are interpreted in the branch's timezone.

servers:
  - url: http://localhost:8080/v1
    description: Local
  - url: https://api.staging.example.ae/v1
    description: Staging

tags:
  - name: health
  - name: auth
  - name: me
  - name: catalog
  - name: availability
  - name: orders
  - name: reels
  - name: feed
  - name: events
  - name: moderation
  - name: actions
  - name: social
  - name: analytics
  - name: listings
  - name: chat
  - name: packages
  - name: driver
  - name: dispatch
  - name: console
  - name: kitchen
    description: Vendor portal kitchen setup — dishes, weekly menu, plans, profile.
  - name: disputes

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- health --
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness — process is up
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness — dependencies reachable
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ------------------------------------------------------------------ auth --
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a one-time code to a phone number
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: Code dispatched (response is identical whether or not the number exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Exchange a one-time code for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerification" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session, or all sessions for this user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------------------- me --
  /me:
    get:
      tags: [me]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/addresses:
    get:
      tags: [me]
      operationId: listAddresses
      summary: The user's saved addresses
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      operationId: createAddress
      summary: Save an address
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # --------------------------------------------------------------- catalog --
  /vendors/{vendorId}:
    get:
      tags: [catalog]
      operationId: getVendor
      summary: Public vendor profile
      security: []
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/offerings:
    get:
      tags: [catalog]
      operationId: listOfferings
      summary: Bookable offerings at a branch
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: service_type
          in: query
          required: false
          description: Filter by service type key, e.g. `laundry_wash_fold`.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceOffering" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- availability --
  /branches/{branchId}/availability:
    get:
      tags: [availability]
      operationId: getAvailability
      summary: Remaining capacity per day and time window
      description: |
        Returns only windows with remaining capacity. A window absent from the response
        is either full, closed, or outside the branch's operating calendar — the client
        must not distinguish between those cases.
      security: []
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: resource_key
          in: query
          required: true
          description: Capacity resource being consumed, e.g. `pickup_slot`, `kitchen_covers`.
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Inclusive. At most 31 days after `from`.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvailabilityDay" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- orders --
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: The user's orders, newest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor:
                    type: [string, "null"]
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Place an order
      description: |
        Reserves capacity, materialises fulfillments, and produces a price quote in
        `estimated` state. No money moves here — payment authorization is a separate
        call so that a failed card does not orphan a capacity reservation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Capacity for the requested window was exhausted between quote and submit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: One order with its fulfillments and quote
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{orderId}/payment-intent:
    post:
      tags: [orders]
      operationId: createPaymentIntent
      summary: Authorize payment for an order
      description: |
        Moves the quote `estimated → authorized`. Returns the gateway client secret;
        the app completes 3DS with the gateway SDK directly and the platform learns
        the outcome by webhook, never by trusting the client.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Quote is not in a state that can be authorized
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ----------------------------------------------------------------- reels --
  /reels/uploads:
    post:
      tags: [reels]
      operationId: createReelUpload
      summary: Reserve a reel and get a presigned upload URL
      description: |
        Creates a `draft` reel and returns a presigned `PUT` for the raw video.

        **The client uploads directly to object storage.** Bytes never pass through
        this API: a 30–60s reel is 10–30 MB, and proxying it would pin a request
        goroutine and a connection for the duration of a mobile upload.

        Send the returned `upload_headers` verbatim on the PUT. A presigned URL signs
        the headers it was created with, so omitting `Content-Type` produces a
        signature mismatch that looks like an auth failure and is not one.

        The upload and the metadata call (`POST /reels/{reelId}`) are independent and
        may complete in either order.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id:
                  type: string
                  format: uuid
                  description: The branch this reel is authored by. The caller must be a member of its vendor.
                content_type:
                  type: string
                  enum: [video/mp4, video/quicktime, video/webm]
                  default: video/mp4
                subject_type: { type: [string, "null"], enum: [service_offering, meal_plan, vehicle_listing, null] }
                subject_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelUpload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /reels/{reelId}:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [reels]
      operationId: updateReel
      summary: Set caption, tags, category and visibility
      description: |
        Idempotent, and may arrive before or after the upload finishes.

        Refused once moderation has begun. Editing a caption after it has passed
        review would let clean text be swapped for dirty text post-approval.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReelMetadata" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorReel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Metadata can no longer be changed at this state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      tags: [reels]
      operationId: getReel
      summary: Author-visible state, including the rejection reason
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorReel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [reels]
      operationId: deleteReel
      summary: Take the reel down
      description: |
        Moves the reel to `removed` and drops it from the feed. The row, its state
        history and its moderation record are kept — they are the evidence when the
        decision is disputed.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reels/{reelId}/report:
    post:
      tags: [reels]
      operationId: reportReel
      summary: Report a reel for policy violation
      description: |
        One report per person per reel. Returns 202 whether or not this reporter has
        already reported it — telling a reporter their duplicate was rejected reveals
        nothing useful and invites them to try again with another account.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [sexual, violence, hate, misleading, spam, illegal, other]
                detail: { type: string, maxLength: 1000 }
      responses:
        "202":
          description: Report received
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [received] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------------ feed --
  /feed:
    get:
      tags: [feed]
      operationId: getFeed
      summary: The local video feed
      description: |
        Ranked as of Phase 4. Retrieval (what is eligible) happens in Postgres;
        ranking (what is best) happens in the service, so that the scoring rules are
        unit-testable. Candidates come from four sources — fresh and geo-local,
        followed authors, category affinity, and an exploration pool — unioned and
        deduplicated.

        **The cursor format changed in Phase 4 and is not compatible with a Phase 2
        cursor.** Score-based keyset pagination stopped working when scoring moved
        out of SQL: a cursor holding a score would ask the next page to compare
        against a number computed from counters that have since moved. A stale cursor
        is rejected with 422 rather than silently restarting from the top.

        Roughly 15% of every page is reserved for reels that have not had a fair
        hearing yet, marked `explore: true`. This costs measured engagement by
        approximately that share and it is the price of having supply next quarter —
        without it new vendors never get impressions and the supply side churns.

        `lat` and `lng` are **required**. The product is local discovery; a feed
        without a location is a different product. Only reels whose resolved coverage
        geometry contains the point are returned.

        Authentication is optional. A signed-in viewer additionally gets block
        filtering, follow-based candidates and per-item `viewer` state; an anonymous
        one is keyed by `X-Device-Id`, which also keys their interest profile.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: category
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: surface
          in: query
          required: false
          schema:
            type: string
            enum: [for_you, live_now, ending_soon, nearby]
            default: for_you
          description: |
            Which feed. Not a filter over a page the ranker already built — it
            changes candidate generation, and for two of the four it replaces the
            ordering:

            | surface | candidates | ordered by |
            |---|---|---|
            | `for_you` | the four sources above | predicted engagement × conversion |
            | `live_now` | time signal open right now | predicted engagement × conversion |
            | `ending_soon` | closing within 6 hours | soonest first |
            | `nearby` | eligible | nearest first |

            `nearby` is not redundant with the geo filter every surface already
            applies. Eligibility means the reel's coverage contains you; a vendor
            delivering city-wide is eligible from thirty kilometres away. This
            surface is for the viewer who wants to walk there.

            `ending_soon` and `nearby` reserve no exploration slots. Exploration
            is a ranking device, and placing a reel closing in five hours above
            one closing in ten minutes would break the only promise the tab
            makes. Nothing is lost: on a surface ordered by time or distance a
            vendor with no engagement history already competes on equal terms.

            **An unrecognised value is served as `for_you` rather than rejected.**
            This is a view preference from a client that may be older than the
            server, and a build that has not heard of a tab we retired should get
            a feed rather than an error. Read `surface` on the response to see
            what you actually got.
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: X-Device-Id
          in: header
          required: false
          description: Namespaces the seen-set for anonymous viewers.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- events --
  /events:
    post:
      tags: [events]
      operationId: submitEvents
      summary: Batched client engagement events
      description: |
        The client batches and POSTs roughly every 10 seconds or on app background.
        One request per event would turn a 30-second viewing session into a dozen
        requests per user.

        Ingest is idempotent: a client that loses its connection mid-POST resends the
        whole batch, and without deduplication every flaky network would inflate the
        view count.

        A **view** is ≥2 seconds watched, deduped per (user, reel, session). Send
        `watched_ms` and let the server apply that definition — it is also what the
        Phase 4 ranking model trains on, and two definitions of the same word is how
        a model learns the wrong thing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                session_id: { type: string, maxLength: 128 }
                events:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ClientEvent" }
      responses:
        "202": { description: Accepted }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ------------------------------------------------------------ moderation --
  /moderation/queue:
    get:
      tags: [moderation]
      operationId: getModerationQueue
      summary: Reels awaiting human review, oldest first
      description: |
        Oldest-first, never by severity: the queue exists to meet a two-hour SLA, and
        any ordering that lets an item be overtaken lets one item sit forever.

        Requires platform staff membership, checked against the database on every
        call rather than carried as a token claim — revoking a moderator has to take
        effect immediately.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ModerationQueueItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/{reelId}/decide:
    post:
      tags: [moderation]
      operationId: decideModeration
      summary: Approve or reject a reel awaiting review
      description: |
        A moderator decides approve or reject. `review` is not accepted — that is
        where the reel already is.

        Approval moves the reel to `approved`, not `published`: publication still
        needs coverage geometry resolved, and folding the two together would let a
        click publish a reel with no audience.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes:
                  type: string
                  description: Shown to the author on rejection. Be specific enough to act on.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [recorded] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Reel is not awaiting review
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # --------------------------------------------------------------- actions --
  /reels/{reelId}/actions:
    put:
      tags: [actions]
      operationId: setReelActions
      summary: Set a reel's call-to-action buttons
      description: |
        Replaces the whole list. Position is implied by array order; index 0 is the
        primary CTA and is the one that gets pressed.

        Refused once moderation has begun, for two reasons. A CTA swapped after
        approval means the reviewed content and the live destination are different
        things — the oldest trick in content moderation. And repointing a published
        reel's CTA would silently reassign its accumulated click history to a new
        target, corrupting the funnel retroactively.

        A CTA whose `(kind, target_type)` pair has no registered handler is rejected
        here rather than stored. Otherwise the failure surfaces weeks later as a
        greyed-out button in the feed, which everyone reads as a feed bug.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  maxItems: 3
                  description: |
                    At most three. Not a storage limit — a product one: a reel with
                    six buttons has no primary call to action, and attribution
                    credits one action, so spreading intent across six makes every
                    one of them look weak.
                  items: { $ref: "#/components/schemas/ActionInput" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Actions are fixed once moderation has begun
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /actions/{actionId}/click:
    post:
      tags: [actions]
      operationId: clickAction
      summary: Record a CTA press and get the route
      description: |
        Recording and routing are the same call deliberately. If the client routed
        itself and reported the click separately, every dropped analytics request
        would be a conversion the server never saw — and those drops are not random,
        they cluster in exactly the bad-network conditions where conversion is
        already lowest. Coupling them means the number cannot quietly under-count.

        The click is recorded even when the CTA resolves unavailable. A viewer
        pressing "Book" on a fully-booked branch is demand, and it is the most
        actionable signal a vendor will get — dropping it because the outcome failed
        would hide a capacity problem behind a conversion one.

        Authentication is optional, but an identity is required: sign in, or send
        `X-Device-Id`. An anonymous viewer who clicks, signs up, and then orders is
        the feed doing the entire job including acquisition, and that path is only
        visible if the click carried a key that survives the sign-up.
      security: []
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Device-Id
          in: header
          required: false
          description: Required when not authenticated.
          schema: { type: string }
        - name: lat
          in: query
          required: false
          schema: { type: number }
        - name: lng
          in: query
          required: false
          schema: { type: number }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string, maxLength: 128 }
                surface:
                  type: string
                  enum: [feed, profile, search, share_link, deep_link]
                  default: feed
                  description: |
                    A click from the feed and one from a shared link are not the same
                    event. Attribution treats everything but `feed` and `search` as
                    off-feed, so the feed's own number stays honest.
                watched_ms:
                  type: integer
                  description: A press at 400ms is a mis-tap; one at 12s is intent.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedAction" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ---------------------------------------------------------------- social --
  /me/follows:
    post:
      tags: [social]
      operationId: follow
      summary: Follow a vendor, branch or creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [followee_type, followee_id]
              properties:
                followee_type: { type: string, enum: [vendor, vendor_branch, user] }
                followee_id: { type: string, format: uuid }
      responses:
        "204": { description: Followed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/follows/{followeeId}:
    delete:
      tags: [social]
      operationId: unfollow
      summary: Unfollow
      parameters:
        - name: followeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [vendor, vendor_branch, user], default: vendor_branch }
      responses:
        "204": { description: Unfollowed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /reels/{reelId}/save:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [social]
      operationId: saveReel
      summary: Save a reel
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [social]
      operationId: unsaveReel
      summary: Remove a saved reel
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------- subscriptions --
  /subscriptions:
    post:
      tags: [subscriptions]
      operationId: createSubscription
      summary: Subscribe to a plan
      description: |
        Creates the subscription, its delivery schedule, and its first billing
        cycle — **and delivers nothing yet.**

        The response carries `order_id`: a real row in `orders`, paid with the same
        `POST /v1/orders/{orderId}/payment-intent` a one-off order uses. A
        subscription's money moves through the same path as any other money in the
        system, so it reaches payments, quotes, the ledger and the vendor's payout
        statement without a second implementation of any of them.

        Deliveries appear once that order is paid. Materialising them at signup
        would hold two weeks of a kitchen's capacity against a card that may
        decline.

        The schedule must match the plan's shape exactly — a customer who picks six
        days on a five-day plan is not paying for six, and the kitchen would cook a
        meal nobody was billed for, every week, invisibly.

        `weekday` is **0 = Sunday**. The GCC working week starts Sunday; ISO-8601's
        Monday-first numbering delivers every meal one day late.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, address_id, start_date, schedule]
              properties:
                plan_id: { type: string, format: uuid }
                tier_id:
                  type: [string, "null"]
                  format: uuid
                  description: Overrides the plan's price, days per week and meals per day.
                address_id: { type: string, format: uuid }
                start_date: { type: string, format: date }
                renewal_mode:
                  type: string
                  enum: [auto, manual, none]
                  default: auto
                  description: |
                    `none` ends the subscription after one cycle — which is how a
                    trial is sold without building a trial feature.
                schedule:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [weekday, meal_slot, window_id]
                    properties:
                      weekday:
                        type: integer
                        minimum: 0
                        maximum: 6
                        description: 0 = Sunday.
                      meal_slot:
                        type: string
                        enum: [breakfast, lunch, dinner, snack, suhoor, iftar]
                        description: |
                          `suhoor` and `iftar` are ordinary values, not exceptions.
                          Meal subscriptions invert during Ramadan and a schedule
                          that cannot express it is a month of undeliverable plans.
                      window_id: { type: string, format: uuid }
                      address_id:
                        type: [string, "null"]
                        format: uuid
                        description: |
                          Per-day override. Office Sunday to Thursday and home on
                          Friday is the normal case in this market, not an edge one.
                source_reel_id: { type: [string, "null"], format: uuid }
                source_action_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: Created, awaiting payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /subscriptions/{subscriptionId}/pause:
    post:
      tags: [subscriptions]
      operationId: pauseSubscription
      summary: Pause deliveries over a date range
      description: |
        Two things happen and they are separable: deliveries stop, and the money is
        dealt with. A pause that only did the first would quietly keep the
        customer's money for meals they never received.

        `credit_mode` decides which. `extend` pushes the end date out by the paused
        delivery days — the default, because a paused subscriber is worth far more
        than a credited one. `wallet` credits the unearned portion instead.

        Only **delivery days** count, not calendar days. A customer on a
        Sunday-to-Thursday plan who pauses over a weekend has lost nothing, and
        charging them two days against their allowance would be wrong.

        Refused past the plan's cutoff: the kitchen has already bought the
        ingredients, and a late pause is waste the vendor absorbs.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_date, to_date]
              properties:
                from_date: { type: string, format: date }
                to_date:
                  type: string
                  format: date
                  description: Inclusive. "Away from the 3rd to the 7th" includes the 7th.
                credit_mode:
                  type: string
                  enum: [extend, wallet]
                  default: extend
      responses:
        "200": { description: Paused }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-error-codes: |
        past_cutoff, allowance_exceeded, no_deliveries

  /subscriptions/{subscriptionId}/skip:
    post:
      tags: [subscriptions]
      operationId: skipDelivery
      summary: Skip a single delivery
      description: |
        Distinct from a pause, and not cosmetically. A skip is one meal the customer
        did not want; it is **not credited** and does not consume the pause
        allowance. A pause is the customer being away, and it is the one with the
        money attached.

        Conflating them would let a customer skip an entire cycle one day at a time
        and expect a refund.

        Omitting `meal_slot` skips every slot on that date.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                meal_slot:
                  type: string
                  enum: [breakfast, lunch, dinner, snack, suhoor, iftar]
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: Skipped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /subscriptions/{subscriptionId}/cancel:
    post:
      tags: [subscriptions]
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: |
        Stops future deliveries and returns the unearned remainder of the current
        cycle to the customer's wallet. Meals already delivered stay delivered, and
        the revenue already recognised against them stays recognised — that money is
        the vendor's and cancelling does not reach back for it.

        The subscription row survives, cancelled. Support answers "why did my meals
        stop" from `subscription_events`, and a deleted row cannot answer it.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reels/{reelId}/like:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [social]
      operationId: likeReel
      summary: Like a reel
      description: |
        Idempotent. A double-tap, a retry on a flaky connection, and a client that
        fires optimistically must all leave exactly one like and move the counter
        exactly once — so `changed` reports whether this call was the one that did
        anything, and the status code is 200 either way.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [liked]
                properties:
                  liked: { type: boolean }
                  changed:
                    type: boolean
                    description: False when the like already existed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [social]
      operationId: unlikeReel
      summary: Remove a like
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [liked]
                properties:
                  liked: { type: boolean }
                  changed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -------------------------------------------------------------- comments --
  /reels/{reelId}/comments:
    parameters:
      - name: reelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [comments]
      operationId: listComments
      summary: A reel's comment thread
      description: |
        Published, undeleted roots newest-first, each followed inline by up to three
        replies. Threads are two levels deep by construction — unbounded nesting is
        unreadable on a phone in portrait, and a thread nobody can read is a thread
        nobody moderates.

        Reading does not require an account. Writing does.
      security: []
      parameters:
        - name: before
          in: query
          required: false
          description: Keyset on the oldest **root** returned by the previous page.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
    post:
      tags: [comments]
      operationId: postComment
      summary: Comment on a reel
      description: |
        Moderated synchronously, before the response returns. A comment that appears
        and then vanishes twenty seconds later reads as censorship; one that takes
        three seconds to appear reads as a slow network.

        **201 means published. 202 means held for review.** The distinction is the
        reason the state exists: a client that renders a pending comment as live
        shows its author something nobody else can see, and they find out days later
        that their question was never asked.

        If the classifier is unavailable or times out, the comment is held — never
        published. Comments arrive at a rate that makes "publish while moderation is
        down" equivalent to "publish everything" within minutes.

        Rate limited in two windows: a burst limit that stops a script and a daily
        limit that stops a determined human working through a competitor's reels one
        comment at a time. Rejected comments count toward both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 600
                  description: |
                    Counted in runes, not bytes. An Arabic comment is roughly two
                    bytes per character, and a byte limit would silently give
                    Arabic-speaking users half the allowance.
                parent_id:
                  type: [string, "null"]
                  format: uuid
                  description: A root comment. Replies to replies are rejected.
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "202":
          description: Accepted and held for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /comments/{commentId}:
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: Delete a comment
      description: |
        The comment's author, the reel's author, and platform staff may all delete.
        The reel's author is on that list because a vendor cannot be told to accept
        whatever appears under their storefront while waiting for a moderator.

        Soft delete: the row survives, because the replies underneath it did not
        consent to disappearing and because a deleted comment is evidence when the
        thread is reported.
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          $ref: "#/components/responses/NotFound"
      x-note: |
        Not-found and not-yours return the same 404. Distinguishing them would let
        anyone enumerate which comment ids exist.

  /comments/{commentId}/report:
    post:
      tags: [comments]
      operationId: reportComment
      summary: Report a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                detail: { type: string, maxLength: 1000 }
      responses:
        "202": { description: Received }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /moderation/comments:
    get:
      tags: [moderation]
      operationId: getCommentQueue
      summary: Comments awaiting a human
      description: |
        Pending and reported comments, oldest first — always. A queue worked
        newest-first leaves its worst backlog permanently unworked, and the comments
        at the bottom are the ones invisible to their authors the longest.

        Separate from the reel queue rather than interleaved: comments arrive at a
        rate orders of magnitude higher and are judged in seconds rather than
        minutes, so mixing them would bury the queue that has a publish SLA on it.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CommentQueueItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/comments/{commentId}/decide:
    post:
      tags: [moderation]
      operationId: decideComment
      summary: Rule on a comment
      description: |
        Approve or reject. "Review" is where it already is.

        Every open report on the comment is resolved by the same ruling — leaving
        them open would mean the next moderator judges a comment that has already
        been judged.
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                notes:
                  type: string
                  description: Shown to the author on a rejection.
      responses:
        "200": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /ranking/profile:
    get:
      tags: [moderation]
      operationId: getRankingProfile
      summary: What is ranking the feed right now
      description: |
        Staff-only. It exists because "the feed looked wrong at 14:20" is otherwise a
        question that gets discussed rather than answered: a ranking system whose
        configuration is invisible turns every regression into an argument about
        whether anything changed.

        Weights live in the `ranking_profiles` table so that retuning — a
        twice-a-week activity — does not require a deploy. Exactly one row may be
        active. A profile that fails validation is refused and the previous weights
        stay in force; if none can be loaded, compiled-in defaults rank the feed.
        Cached for up to one minute.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankingProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------- analytics --
  /reels/{reelId}/funnel:
    get:
      tags: [analytics]
      operationId: getReelFunnel
      summary: One reel's conversion funnel
      description: |
        Scoped to the reel's author.

        There is deliberately no single `conversion_rate` field. The available
        denominators differ by an order of magnitude — orders ÷ clicks flatters
        roughly tenfold against orders ÷ impressions — so every rate is returned
        named for its denominator, and orders are split by attribution model rather
        than summed.
      parameters:
        - name: reelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelFunnel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /analytics/feed-funnel:
    get:
      tags: [analytics]
      operationId: getFeedFunnel
      summary: Platform-wide conversion — does the feed produce bookings?
      description: |
        The number Phase 3 exists to produce, and the one the decision to keep
        investing in video rests on.

        Staff-only. Not because it is sensitive, but because it must not circulate
        stripped of the `definitions` block that makes it interpretable: the same
        raw counts support a flattering reading and a conservative one, and the
        response carries the definitions so both parties are quoting the same thing.

        `feed_share_of_orders` is verifiable click-attributed orders over *all*
        orders placed, including organic. It is the conservative reading on purpose.
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedFunnel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Phase 6 · vehicles ────────────────────────────────────────────────────
  #
  # A second supply engine behind the same feed. Note what is absent from every
  # operation below: no order, no capacity, no fulfillment, no commission. The
  # sale closes offline at an RTA counter the platform never observes, so this
  # vertical's conversion event is a *lead*, and nothing past that point is
  # verifiable. See docs/PHASE-6-VEHICLES.md §5 before quoting any number that
  # comes after `POST /listings/{listingId}/inquire`.

  /listings:
    get:
      tags: [listings]
      operationId: searchListings
      summary: Faceted used-car search
      description: |
        Public. Car search arrives from shared links and search engines more than
        any other surface in the product, and a login wall there converts a
        motivated buyer into a bounce.

        Results are *complete* within the filter, not "best matches". A buyer who
        filters for a 2019 Patrol under 120k and is shown a curated subset will not
        believe the site — which is why this is Postgres and not the reel ranker.

        `regional_spec` is the filter most worth understanding: GCC, US, Japanese
        and European specs of the same year and mileage are different products and
        the difference swings resale value 20–30%.

        Every promoted result carries `promoted: true`. Paid placement is capped at
        two per page — a page where everything is featured is an advertisement, and
        then the placement is worth nothing to the seller who bought it.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free text over title and description }
        - { name: make_id, in: query, schema: { type: string }, description: Comma-separated uuids }
        - { name: model_id, in: query, schema: { type: string }, description: Comma-separated uuids }
        - { name: year_min, in: query, schema: { type: integer } }
        - { name: year_max, in: query, schema: { type: integer } }
        - { name: price_min_minor, in: query, schema: { type: integer, format: int64 } }
        - { name: price_max_minor, in: query, schema: { type: integer, format: int64 } }
        - { name: mileage_max, in: query, schema: { type: integer } }
        - name: regional_spec
          in: query
          description: Comma-separated. gcc, us, japanese, european, canadian, chinese, other
          schema: { type: string }
        - { name: transmission, in: query, schema: { type: string } }
        - { name: fuel_type, in: query, schema: { type: string } }
        - { name: body_type, in: query, schema: { type: string } }
        - { name: seller_kind, in: query, schema: { type: string, enum: [private, dealer] } }
        - { name: lat, in: query, schema: { type: number, format: double } }
        - { name: lng, in: query, schema: { type: number, format: double } }
        - { name: radius_m, in: query, schema: { type: integer } }
        - name: sort
          in: query
          description: |
            `newest` orders by the later of published_at and bumped_at — a bump is
            what a seller buys, and hiding its effect in a sort nobody selects
            would make the product not work.
          schema:
            type: string
            enum: [newest, price_asc, price_desc, mileage_asc, year_desc, distance]
        - { name: limit, in: query, schema: { type: integer, maximum: 60 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingSearchResult" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    post:
      tags: [listings]
      operationId: createListing
      summary: Create a listing draft
      description: |
        Drafts are free and unlimited. Quota is checked when the listing is
        submitted for review and spent when it is approved — charging before the
        seller has seen their own listing loses the seller, and a listing rejected
        by a moderator must not cost anything.

        `seller_kind` is deliberately not accepted here. It is derived from whether
        the caller has an active dealer profile: a private seller who could set it
        themselves would get the dealer badge for free, and that badge is the only
        signal a buyer has.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingDraft" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /listings/{listingId}/submit:
    post:
      tags: [listings]
      operationId: submitListing
      summary: Send a draft to the review queue
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200": { description: Queued for review }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            No listing credit. Buy a package first — see `GET /listing-packages`.

  /listings/{listingId}/price:
    patch:
      tags: [listings]
      operationId: changeListingPrice
      summary: Change the asking price
      description: |
        A price *drop* publishes immediately: it is the healthiest thing a stale
        listing can do, and putting it behind a review queue means sellers stop
        doing it. A price *rise* on a live listing returns the listing to review —
        that is the bait-and-switch shape, and it raises a fraud signal either way.

        Every change writes a price-history row, which buyers can see and which the
        price-outlier detector reads.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_minor]
              properties:
                price_minor: { type: integer, format: int64 }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /listings/{listingId}/sold:
    post:
      tags: [listings]
      operationId: markListingSold
      summary: Mark a listing sold
      description: |
        `sold_price_minor` is **seller-declared and unverified**. The platform never
        observes the transaction — it happens at an RTA counter — so this is a
        survey answer, not a market observation. The response says so explicitly,
        and nothing downstream may present it as a market price.

        Sold is not terminal: deals fall through, and forcing a re-listing would
        lose the photos, the reel and the history the fraud detectors read.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sold_price_minor: { type: integer, format: int64 }
      responses:
        "200": { description: Marked sold }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /listings/{listingId}/status:
    post:
      tags: [listings]
      operationId: setListingStatus
      summary: Pause, resume or remove a listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, removed] }
                reason: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Not a legal transition from the current status }

  /listings/{listingId}/inquire:
    post:
      tags: [listings]
      operationId: inquireAboutListing
      summary: Contact the seller — this vertical's conversion event
      description: |
        The analogue of `POST /orders`, and deliberately much smaller: no capacity,
        no pricing, no payment, no fulfillment. What it shares with an order is the
        Phase 3 attribution chain, so "did a reel produce a lead" is answerable with
        the same query shape as "did a reel produce a booking".

        Opens a conversation as a side effect. The seller's phone number is never
        published — that is the entire reason chat exists in this vertical.

        Idempotent per (listing, buyer): a second call returns `200` with the same
        lead, because a buyer who taps twice must not double a seller's lead count.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [reel_action, listing_page, search, saved_search] }
                source_reel_id: { type: string, format: uuid }
                source_action_id: { type: string, format: uuid }
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
        "200":
          description: Existing lead — this buyer has already contacted this seller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inquiry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "The listing is sold, expired or under review" }

  /listings/{listingId}/offers:
    post:
      tags: [listings]
      operationId: makeOffer
      summary: Offer a price — non-binding
      description: |
        **An accepted offer is not a contract and no money is held.** Escrow would
        solve most of this category's fraud and implies a payment-institution
        licence, which is not built. The response carries `binding: false` so a
        client cannot render this as a commitment without ignoring the API.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, format: int64 }
      responses:
        "201":
          description: Offer recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "The listing is not available, or it is your own" }

  /offers/{offerId}/respond:
    post:
      tags: [listings]
      operationId: respondToOffer
      summary: Accept or reject an offer
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        "200": { description: Answered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Already answered, withdrawn or expired" }

  /listings/{listingId}/favourite:
    put:
      tags: [listings]
      operationId: favouriteListing
      summary: Save a listing
      description: |
        Distinct from saving a reel. A listing outlives the reel that advertised it
        and a reel can advertise a listing that has sold, so collapsing the two
        would make "my saved cars" show sold cars.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [listings]
      operationId: unfavouriteListing
      summary: Remove a saved listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /listings/{listingId}/report:
    post:
      tags: [listings]
      operationId: reportListing
      summary: Report a listing
      description: |
        Returns 202, never 200. The report is recorded; the outcome is a human's.
        A 200 reads as "handled" and the reporter checks back tomorrow to find the
        listing still up.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "202": { description: Report received }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /listings/{listingId}/bump:
    post:
      tags: [packages]
      operationId: bumpListing
      summary: Spend a bump credit
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200": { description: Bumped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: No bumps left on any active package }

  /listings/{listingId}/feature:
    post:
      tags: [packages]
      operationId: featureListing
      summary: Spend featured days
      description: |
        The feature ends with the package that paid for it, never after. Selling
        reach that outlives its entitlement is how a promotions table starts
        disagreeing with the money behind it.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200": { description: Featured }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: No package with featured days }

  /listing-packages:
    get:
      tags: [packages]
      operationId: listListingPackages
      summary: What a listing costs
      description: |
        Prices are **tax-inclusive**, which is what a UAE consumer price must be.
        The platform is the supplier of record here — unlike GMV, where the vendor
        is — so this VAT is the platform's own output tax and is due at payment.

        The free tier is not a trial. Supply is the binding constraint in a
        cold-start classifieds market, and charging a private seller to list their
        only car before there are buyers is how the listing count stays at zero.
      security: []
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [private, dealer] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ListingPackage" }

  /listing-packages/{packageId}/purchase:
    post:
      tags: [packages]
      operationId: purchaseListingPackage
      summary: Buy a listing package
      description: |
        Returns a purchase awaiting payment; free packages activate immediately and
        post nothing to the ledger. Paid purchases become active when the payment
        succeeds, at which point the fee lands in **deferred revenue** and is
        recognised straight-line across the entitlement window — the same
        arithmetic a prepaid meal cycle uses.
      parameters:
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Purchase created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackagePurchase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Dealer packages require a verified dealer profile }

  /reels/uploads/personal:
    post:
      tags: [reels]
      operationId: createPersonalReelUpload
      summary: Upload a seller reel
      description: |
        The Phase 6 authoring path, and a separate endpoint from `/reels/uploads`
        rather than a nullable branch id. The two authorise on completely different
        grounds — branch membership versus owning the subject — and one endpoint
        choosing between them based on which field is null is one refactor away
        from letting a user post as a vendor.

        Every author here is `new` in author_trust, so **all** of this content is
        reviewed by a human before it appears. The response says so: a seller who
        expects their video live in ninety seconds and gets it in two hours writes
        a one-star review about a system working exactly as designed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id]
              properties:
                subject_type: { type: string, enum: [vehicle_listing] }
                subject_id: { type: string, format: uuid }
                content_type: { type: string, default: video/mp4 }
      responses:
        "201":
          description: Draft created with a presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelUpload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: You do not own this listing }

  # ── Phase 6 · chat ────────────────────────────────────────────────────────

  /me/conversations:
    get:
      tags: [chat]
      operationId: listConversations
      summary: Message inbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversationId}/messages:
    get:
      tags: [chat]
      operationId: listMessages
      summary: Read a thread
      description: |
        A sender always sees their own held message; the recipient never does. A
        sender whose message vanished without trace re-sends it four more ways, and
        each attempt is another row for a moderator to read.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [chat]
      operationId: sendMessage
      summary: Send a message
      description: |
        Every message is scanned before it is stored, and the verdict decides the
        row's state — so a held message is never briefly visible to a poller.

        Three outcomes:

        - **201 `sent`** — delivered unchanged.
        - **201 `redacted`** — contact details removed, message delivered. The
          response names what was removed. Most people sharing a number are not
          defrauding anyone; they are trying to arrange a viewing and the app felt
          slower than WhatsApp. Blocking them teaches them the product is broken.
        - **202 `held`** — advance-fee language, or a message that is nothing but
          contact details. A human decides. The recipient sees nothing and their
          unread badge does not move, because a badge with nothing behind it reads
          as a bug and produces a support ticket for every held scam.

        The scanner folds Arabic-Indic digits before matching. A number typed as
        ٠٥٠١٢٣٤٥٦٧ is a number.
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Delivered, possibly redacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "202":
          description: Held for review — not delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /conversations/{conversationId}/read:
    post:
      tags: [chat]
      operationId: markConversationRead
      summary: Clear the unread badge
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Phase 6 · moderation ──────────────────────────────────────────────────

  /moderation/listings/{listingId}/decide:
    post:
      tags: [moderation]
      operationId: decideListing
      summary: Approve or reject a listing
      description: |
        Approval is the only path to `active`, and it spends the seller's listing
        credit. Rejection costs them nothing.
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string }
      responses:
        "200": { description: Decided }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/messages:
    get:
      tags: [moderation]
      operationId: listHeldMessages
      summary: Held chat messages
      description: |
        A third queue, alongside reels and comments. Held messages arrive at chat
        volume and are judged in seconds; interleaving them with reels would bury
        the queue that has a publish SLA on it.

        The body returned here is the **original**, unredacted. A reviewer judging
        whether a message is a scam needs the text that triggered the hold.
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/HeldMessage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/messages/{messageId}/decide:
    post:
      tags: [moderation]
      operationId: decideHeldMessage
      summary: Release or block a held message
      description: |
        Releasing delivers the **redacted** body, not the original. Judging that a
        message is not a scam is not the same decision as publishing the phone
        number inside it, and only one of them was asked for.
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release]
              properties:
                release: { type: boolean }
      responses:
        "200": { description: Decided }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: This message is no longer held }

  /moderation/fraud:
    get:
      tags: [moderation]
      operationId: listFraudSignals
      summary: Open fraud evidence, worst subjects first
      description: |
        Ordered by trust score ascending, then by age. Ordering by age alone buries
        a stolen-vehicle hit behind three hundred shared-phone-number rows.

        `weight_if_confirmed` is what confirming this signal will cost the subject.
        A reviewer deciding without knowing that is guessing — and the invariant
        behind it is worth stating: **no machine signal can block an account on its
        own. Only a human confirming one can.**
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FraudSignal" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/fraud/decide:
    post:
      tags: [moderation]
      operationId: decideFraudSignal
      summary: Confirm or dismiss fraud evidence
      description: |
        A dismissed signal is kept, at zero weight. "We looked and it was fine" is a
        different fact from "we never saw it", and only one of them survives an
        appeal — or stops the next detector run raising it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, kind, confirm]
              properties:
                subject_type: { type: string, enum: [listing, user, conversation, message] }
                subject_id: { type: string, format: uuid }
                kind: { type: string }
                confirm: { type: boolean }
      responses:
        "200":
          description: Rescored
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: integer }
                  band: { type: string, enum: [ok, watch, restricted, blocked] }
        "403": { $ref: "#/components/responses/Forbidden" }


  # ── Phase 7 · driver ──────────────────────────────────────────────────────
  #
  # The whole driver API. Read what is *not* in any response below: no item
  # list, no product name, no order total, no vertical. Everything a driver
  # needs — an address, a window, a name, a phone number — was snapshotted onto
  # the fulfillment when it was created, which is the Fulfillment primitive
  # (PLAN.md §1) paying off. See docs/PHASE-7-CLIENTS-AND-LOGISTICS.md §2.
  #
  # No route carries a driver id. Every one resolves the signed-in user to a
  # driver server-side: a client that can name which driver it is acting as is a
  # client that can complete someone else's deliveries.

  /driver/shifts:
    post:
      tags: [driver]
      operationId: startShift
      summary: Go on shift
      description: |
        Refuses a second open shift rather than silently reusing the first. Two
        overlapping shifts make "was anyone on shift at 19:40" ambiguous, and that
        is the first question asked after a late delivery.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                branch_id: { type: string, format: uuid }
      responses:
        "201":
          description: On shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift_id: { type: string, format: uuid }
        "403": { description: Not an active driver }
        "409": { description: This driver already has an open shift }

  /driver/shifts/end:
    post:
      tags: [driver]
      operationId: endShift
      summary: Go off shift
      description: |
        **Undelivered stops are returned to dispatch.** A driver who ends their
        shift with four stops left has four customers waiting on someone who has
        gone home, and leaving the route assigned means the planner skips that
        work entirely — the fulfillments look handled and nobody is handling them.
      responses:
        "200": { description: "Off shift, work released" }
        "403": { description: Not an active driver }

  /driver/manifest:
    get:
      tags: [driver]
      operationId: getManifest
      summary: The driver's stops for a day
      parameters:
        - name: date
          in: query
          description: Defaults to today. A driver opening the app has not chosen a date and never will.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "403": { description: Not an active driver }

  /driver/stops/{fulfillmentId}/dispatch:
    post:
      tags: [driver]
      operationId: dispatchStop
      summary: Pick up the work and issue the delivery code
      description: |
        Issues a four-digit code to the customer and starts the route.

        The code is issued here rather than at completion because the customer
        needs it *before* the driver arrives, and issuing it at creation means it
        sits in a notification for three days before the delivery it belongs to.
        Only its hash is stored: a database reader who can see every OTP can mark
        every delivery complete.
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      responses:
        "200": { description: "Dispatched, code issued to the customer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not a legal transition from the current status }

  /driver/stops/{fulfillmentId}/advance:
    post:
      tags: [driver]
      operationId: advanceStop
      summary: Move a stop through the lifecycle
      description: |
        `en_route` and `arrived` only — completing and failing carry proof and a
        reason and have their own endpoints.

        Marking arrival is geofenced to 250 m. Generous on purpose: GPS in a dense
        urban block is routinely 100 m out, and a driver who cannot mark arrival
        stops using the app and phones the customer instead, at which point there
        is no record of anything.

        `arrived` can go back to `en_route`. A driver who marked the wrong
        building needs a way back that is not "fail the delivery" — without it
        they fail and redeliver, and the failure statistics stop meaning anything.
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [en_route, arrived] }
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        "200": { description: Advanced }
        "409": { description: "Illegal transition, or too far from the address to mark arrival" }

  /driver/stops/{fulfillmentId}/complete:
    post:
      tags: [driver]
      operationId: completeStop
      summary: Close a stop with proof
      description: |
        Proof requirements are graded, and the grading is sent with the manifest
        so the driver knows before they are at the door:

        - **cash on the stop → OTP, always.** "The driver says they collected
          AED 240" is not a position anyone can defend.
        - **pickup → photo.** The customer is handing something over, so their
          presence is self-evident; the disputed question is *what was collected*.
        - **delivery → recipient name.** The disputed question is whether anyone
          received it at all.

        `left_at_door` is never sufficient. It is named honestly because it proves
        the driver says so and nothing else.

        `collected_minor` may differ from what was expected — the customer had no
        change, or paid part by card. Commission is taken on what was *collected*,
        not on what was owed: charging a vendor commission on money nobody received
        is a bill they will query and win.
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryProof" }
      responses:
        "200": { description: Completed }
        "403": { description: The delivery code does not match }
        "409": { description: "Not arrived yet, or the proof is weaker than this stop requires" }

  /driver/stops/{fulfillmentId}/fail:
    post:
      tags: [driver]
      operationId: failStop
      summary: Close a stop without delivering
      description: |
        The outcome comes from a closed list. Free text would produce "customer not
        answering", "no answer", "nobody home" and "cust absent" as four distinct
        reasons, and then nobody can tell whether the time windows are wrong or the
        address capture is.

        A driver cannot *cancel* work — only fail it, with a reason and an attempt
        row. A driver who could cancel has a way to make their route shorter, and
        the incentive points exactly the wrong way.
      parameters:
        - $ref: "#/components/parameters/FulfillmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [customer_absent, wrong_address, refused, unreachable, access_denied, vehicle_issue, cancelled_by_customer]
                note: { type: string }
                lat: { type: number, format: double }
                lng: { type: number, format: double }
      responses:
        "200": { description: "Failed, attempt recorded" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /driver/location:
    post:
      tags: [driver]
      operationId: reportLocation
      summary: Report position
      description: |
        Returns 204 with no body. This is the highest-frequency write in the
        system — every driver, every fifteen seconds — and a JSON response the
        client discards is bytes on a mobile connection somebody is paying for.

        Pings are retained for 30 days and dropped a partition at a time. This is
        location data about identifiable people; keeping it forever is a liability
        rather than an asset, and its operational value is spent within days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double }
                lng: { type: number, format: double }
                accuracy_m: { type: number, format: float }
                speed_kmh: { type: number, format: float }
                route_id: { type: string, format: uuid }
      responses:
        "204": { description: Recorded }

  /driver/cash:
    get:
      tags: [driver]
      operationId: getHeldCash
      summary: What this driver is carrying
      description: |
        The balance of a driver's float account is exactly the cash they are
        holding that the platform has not received. Everything in the cash model
        follows from keeping that sentence true.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections: { type: integer }
                  total_minor: { type: integer, format: int64 }
                  currency: { type: string }

  /driver/cash/remittances:
    post:
      tags: [driver]
      operationId: declareRemittance
      summary: Declare cash for hand-in
      description: |
        The driver declares; someone at the branch counts. They are separate
        fields and separate moments because collapsing them means the system can
        never represent a shortfall — and a system that cannot represent a
        shortfall gets one anyway, silently.
      responses:
        "201":
          description: Declared
          content:
            application/json:
              schema:
                type: object
                properties:
                  remittance_id: { type: string, format: uuid }
                  declared_minor: { type: integer, format: int64 }
                  next_step: { type: string }
        "409": { description: Nothing to remit }

  # ── Phase 7 · dispatch ────────────────────────────────────────────────────

  /branches/{branchId}/dispatch:
    get:
      tags: [dispatch]
      operationId: getDispatchBoard
      summary: The branch's routes for a day
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchBoard" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/dispatch/plan:
    post:
      tags: [dispatch]
      operationId: planRoutes
      summary: Sequence unrouted work into routes
      description: |
        Idempotent: it reads only fulfillments with no route, so running it again
        picks up whatever arrived since and leaves the rest alone. The worker runs
        it every five minutes; this endpoint exists so a dispatcher can force it
        after a late batch of orders.

        Stops are grouped by time window *before* sequencing. A route that mixes
        the 09:00–12:00 and 18:00–21:00 windows is a driver sitting in a car park
        for five hours, and no amount of clever sequencing fixes it — the
        constraint is the promise made to the customer, not the geometry.

        `stops_already_late` is returned rather than buried in a log. A plan with
        late stops in it is a reassignment decision now, not a customer discovery
        in three hours.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Planned
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes_created: { type: integer }
                  stops_routed: { type: integer }
                  unrouted: { type: integer }
                  stops_already_late: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /routes/{routeId}/assign:
    post:
      tags: [dispatch]
      operationId: assignRoute
      summary: Give a route to a driver
      description: |
        Re-checks the driver's own stop capacity, because the planner split routes
        against a default maximum and the driver who ends up taking one may be on
        a bike.
      parameters:
        - name: routeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_id]
              properties:
                driver_id: { type: string, format: uuid }
      responses:
        "200": { description: Assigned }
        "409": { description: "Route already started, driver inactive, or too many stops for this vehicle" }

  # ── Phase 7 · vendor console ──────────────────────────────────────────────

  /me/memberships:
    get:
      tags: [console]
      operationId: listMemberships
      summary: Which vendors this user works for
      description: |
        A null `branch_id` means vendor-wide. The distinction is load-bearing: a
        chain delegates by branch, and a manager scoped to one facility must not
        see another's revenue.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }

  /me/branches:
    get:
      tags: [kitchen]
      operationId: listMyBranches
      summary: Every branch this user can open in the vendor portal
      description: |
        Memberships expanded to concrete branches: a vendor-wide membership lists
        every branch of that vendor. When a user holds both a vendor-wide and a
        branch row, the strongest role wins.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BranchAccess" }

  /branches/{branchId}/overview:
    get:
      tags: [kitchen]
      operationId: getKitchenOverview
      summary: Subscriber counts and the setup checklist
      parameters: [{ $ref: "#/components/parameters/BranchId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenOverview" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/profile:
    parameters: [{ $ref: "#/components/parameters/BranchId" }]
    get:
      tags: [kitchen]
      operationId: getKitchenProfile
      summary: The kitchen's storefront card
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [kitchen]
      operationId: updateKitchenProfile
      summary: Edit the storefront card (owner or manager)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KitchenProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/dishes:
    parameters: [{ $ref: "#/components/parameters/BranchId" }]
    get:
      tags: [kitchen]
      operationId: listDishes
      summary: Every dish this branch cooks, archived ones last
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dish" }
                  allergens:
                    type: array
                    description: The closed allergen list a dish may declare.
                    items: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [kitchen]
      operationId: createDish
      summary: Add a dish (owner or manager)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DishInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dish" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/dishes/{dishId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
      - { name: dishId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [kitchen]
      operationId: updateDish
      summary: Edit, archive (is_active false) or restore a dish
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DishInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dish" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/menu:
    get:
      tags: [kitchen]
      operationId: getWeeklyMenu
      summary: The branch's fixed weekly menu
      description: |
        One cell per weekday (0 = Sunday) and meal slot that has a dish: a
        default and optionally one alternative. Customers who do not choose get
        the default.
      parameters: [{ $ref: "#/components/parameters/BranchId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyMenu" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/menu/{weekday}/{slot}:
    put:
      tags: [kitchen]
      operationId: setMenuSlot
      summary: Replace one cell of the weekly menu
      description: |
        Both null clears the cell. An alternative without a default, or the same
        dish twice, is a 422. Dishes must be active and belong to the branch.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: weekday, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 6 } }
        - { name: slot, in: path, required: true, schema: { $ref: "#/components/schemas/MealSlot" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                default_dish_id: { type: [string, "null"], format: uuid }
                alternative_dish_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The whole menu after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyMenu" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/plans:
    parameters: [{ $ref: "#/components/parameters/BranchId" }]
    get:
      tags: [kitchen]
      operationId: listKitchenPlans
      summary: The branch's meal plans with tiers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KitchenPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [kitchen]
      operationId: createKitchenPlan
      summary: Create a plan (owner or manager)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KitchenPlanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenPlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
      - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [kitchen]
      operationId: getKitchenPlan
      summary: One plan with tiers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [kitchen]
      operationId: updateKitchenPlan
      summary: Edit a plan; tiers are replaced by key, removed tiers deactivated
      description: |
        `409 plan_has_subscribers` when the plan has live subscriptions and the
        change touches cycle_days, days_per_week or meal_slots.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KitchenPlanInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenPlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Plan shape locked by live subscribers }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /branches/{branchId}/summary:
    get:
      tags: [console]
      operationId: getBranchSummary
      summary: Today, at a glance
      description: |
        `payable_minor` comes live from the ledger, not from the last statement. A
        vendor asking "what am I owed" on a Wednesday wants the current number, and
        statements close weekly.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/queue:
    get:
      tags: [console]
      operationId: getOrderQueue
      summary: Everything this branch owes today, by window
      description: |
        Unlike the driver's manifest, this response *does* carry item names. That
        asymmetry is the point of the Fulfillment seam rather than a violation of
        it: dispatch answers "where does the van go", which is the same question
        for a meal box and a laundry bag; the console answers "what does my kitchen
        cook by six", which is meaningless without knowing what a meal is.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QueueItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{branchId}/calendar:
    get:
      tags: [console]
      operationId: getCapacityCalendar
      summary: Capacity utilisation by day, window and resource
      description: |
        The read side of PLAN.md §2.3's concurrency hotspot. Deliberately a plain
        aggregate: the write path holds the correctness guarantee in a CHECK
        constraint, and a read that tried to be authoritative would be a second,
        slower version of the same rule.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells:
                    type: array
                    items: { $ref: "#/components/schemas/CapacityCell" }

  /branches/{branchId}/roster:
    get:
      tags: [console]
      operationId: getSubscriptionRoster
      summary: The kitchen's prep list for a day
      description: |
        The most-used screen in a meal business, and the reason Phase 5's scheduler
        materialises fulfillments 14 days ahead: a kitchen that cannot see Thursday
        until Thursday cannot buy for Thursday.
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RosterEntry" }

  /vendors/{vendorId}/statements:
    get:
      tags: [console]
      operationId: listPayoutStatements
      summary: Payout statements
      description: |
        A statement is **derived, never authoritative**. Every number on it is a
        sum over `ledger_entries` for the period. It exists so a vendor can be
        shown a stable version of that sum — a screen that recomputes on every load
        shows a different total the moment a late refund lands, and then nobody can
        be paid against it. If a statement and the ledger ever disagree, the ledger
        is right.

        Periods run Sunday–Saturday. An ISO week starting Monday cuts the Gulf
        weekend in half, so a vendor's busiest two days land in different
        statements and their weekly figures oscillate for reasons unrelated to
        their business.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PayoutStatement" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vendors/{vendorId}/statements/{statementId}:
    get:
      tags: [console]
      operationId: getPayoutStatement
      summary: A statement's lines
      description: |
        The screen where a vendor disagrees with a number. Every line carries a
        `journal_id` pointing back into the ledger — which is what makes "why is
        this AED 43" answerable rather than re-derivable.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: statementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/StatementLine" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cash/remittances/{remittanceId}/settle:
    post:
      tags: [console]
      operationId: settleRemittance
      summary: Count a driver's cash in
      description: |
        Vendor-side, never driver-side: the person who counts must not be the
        person who declared.

        A shortfall has **no ledger posting of its own**. The difference simply
        stays in the driver's float, which is exactly what that account means —
        cash they are holding that the platform has not received. Only a decision
        to stop pursuing it moves the money, and that is a write-off.
      parameters:
        - name: remittanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_minor]
              properties:
                counted_minor: { type: integer, format: int64 }
      responses:
        "200": { description: Settled }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Phase 7 · disputes ────────────────────────────────────────────────────

  /disputes:
    post:
      tags: [disputes]
      operationId: openDispute
      summary: Raise a dispute
      description: |
        The response carries `due_at`, computed from the dispute kind. Returned
        rather than kept internal: a customer told when to expect an answer stops
        asking for one every hour.

        SLAs are 4h for the kinds where the customer is still waiting for
        something — not delivered, damaged, wrong item — and 24–72h for the rest,
        which are money and can wait a day without anyone going hungry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, kind]
              properties:
                subject_type: { type: string, enum: [order, fulfillment, subscription, payout_statement, listing] }
                subject_id: { type: string, format: uuid }
                raised_as: { type: string, enum: [customer, vendor, driver] }
                kind:
                  type: string
                  enum: [not_delivered, damaged, wrong_item, late, quality, charged_incorrectly, payout_amount, driver_conduct, other]
                body: { type: string }
      responses:
        "201":
          description: Raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  reference_no: { type: string }
                  state: { type: string }
                  due_at: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    get:
      tags: [disputes]
      operationId: listDisputes
      summary: The ops worklist
      description: |
        Ordered by the clock, not by age. An eight-hour-old payout query with a
        72-hour SLA is not more urgent than a one-hour-old "it never arrived" with
        a four-hour one, and a queue sorted by age says it is.

        Requires the `ops` or `superadmin` role. A moderator judges content;
        refunding money and suspending vendors is a different job with a different
        blast radius, and one role covering both is how a content moderator ends up
        able to move cash.
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /disputes/{disputeId}/resolve:
    post:
      tags: [disputes]
      operationId: resolveDispute
      summary: Close a dispute
      description: |
        `resolution` comes from a closed list and `note` is required. The list
        exists because "how often do we refund" is a question ops asks weekly and a
        free-text note cannot answer it; the note is required because a refund with
        no stated reason is indistinguishable from an unauthorised one six months
        later.

        The audit row is written in the same transaction as the decision — a refund
        and the record of who made it must not be able to come apart.
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution, note]
              properties:
                resolution:
                  type: string
                  enum: [refunded, partially_refunded, redelivered, credited, no_action, vendor_charged, driver_penalised]
                amount_minor: { type: integer, format: int64 }
                note: { type: string }
      responses:
        "200": { description: Resolved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Already closed }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # -- Phase 8 . market readiness ---------------------------------------------
  #
  # Everything below exists to satisfy an obligation rather than a feature
  # request. A customer never asked for an opt-out switch, a vendor never asked
  # to upload a trade licence, and an author never asked for an appeals form -
  # they are here because launching without them is not permitted in either
  # market.

  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The in-app inbox
      description: |
        In-app and push messages only. SMS and WhatsApp are not listed: a message
        sent to a phone is not something the app should be able to re-read, and a
        delivery code that stays visible in an inbox defeats the point of it
        being one-time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /me/notifications/{notificationId}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marked }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/notification-preferences:
    put:
      tags: [notifications]
      operationId: setNotificationPreference
      summary: Opt in or out of a category on a channel
      description: |
        Only `marketing` may be switched off. A delivery code, a login code and an
        order confirmation cannot be - a customer who could refuse the first is a
        customer standing at their door unable to receive an order they paid for.

        Attempting to refuse a non-optional category returns 422 with the reason
        rather than 403, because the client shows it next to the switch and that
        is the only place anyone can act on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, channel, allowed]
              properties:
                category: { type: string, enum: [marketing] }
                channel: { type: string, enum: [sms, push, email, whatsapp, in_app] }
                allowed: { type: boolean }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/invoices:
    get:
      tags: [invoices]
      operationId: listMyInvoices
      summary: Tax invoices issued to the caller
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceSummary" }

  /me/standing:
    get:
      tags: [moderation]
      operationId: getMyStanding
      summary: The caller's own moderation record
      description: |
        Includes the date the next strike expires. "You are restricted" with no end
        date is indistinguishable from a ban, and an author who believes they have
        been banned does not come back when the restriction lifts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  standing: { type: string, enum: [none, warned, review_all, suspended, banned] }
                  active_strikes: { type: integer }
                  next_expires_at: { type: string, format: date-time }

  /appeals:
    post:
      tags: [moderation]
      operationId: openAppeal
      summary: Challenge a moderation decision
      description: |
        Answered within an SLA. An appeals process with no deadline is a way of
        saying no slowly, and the app stores treat "users cannot appeal" as a
        policy violation rather than a product choice.

        An appeal is never reviewed by the person whose decision is being appealed
        - enforced by a database constraint, not by rota discipline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, statement]
              properties:
                subject_type: { type: string, enum: [reel, comment, message, listing, strike, account] }
                subject_id: { type: string, format: uuid }
                statement: { type: string, minLength: 10 }
      responses:
        "201":
          description: Opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  due_in_days: { type: integer }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /vendors/{vendorId}/compliance:
    get:
      tags: [payouts]
      operationId: getVendorCompliance
      summary: Why this vendor can or cannot be paid
      description: |
        Every entry in `blocking` is phrased as something the vendor can do.
        "Not eligible" opens a support ticket; "your trade licence expired on 12
        June" gets it renewed.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible_for_payout: { type: boolean }
                  blocking:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /vendors/{vendorId}/payout-account:
    post:
      tags: [payouts]
      operationId: addPayoutAccount
      summary: Register the bank account payouts go to
      description: |
        The IBAN is checked with ISO 7064 MOD-97-10 before it is stored. A payout
        sent to a mistyped IBAN is not bounced immediately - it is accepted, moves
        through the correspondent chain for days, and comes back minus fees, or
        does not come back at all.

        Every change re-enters verification. "The vendor changed their IBAN" is the
        most common payout-fraud pattern there is, and an account that inherited
        the previous one's verified state is exactly what an attacker wants.

        The response echoes the IBAN masked. Responses are logged, cached and
        screenshotted in ways request bodies are not.
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban, holder_name]
              properties:
                iban: { type: string }
                bank_name: { type: string }
                holder_name: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "201":
          description: Registered, pending verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  iban: { type: string, description: Masked }
                  status: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /kyc/cases/{caseId}/decide:
    post:
      tags: [moderation]
      operationId: decideKycCase
      summary: Approve or reject an identity check
      description: |
        Approval takes its expiry from the earliest document expiry on the case,
        not from a date the reviewer picks. A case backed by a trade licence
        expiring in March is not verified past March, whatever anyone sets.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string, description: Required on rejection }
      responses:
        "204": { description: Decided }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /payout-accounts/{accountId}/verify:
    post:
      tags: [payouts]
      operationId: verifyPayoutAccount
      summary: Confirm the account holder matches the identity check
      description: |
        A person does the comparison, because "Karama Kitchen L.L.C." against
        "KARAMA KITCHEN LLC" is not a regex. What the code enforces is that the
        comparison happened and who says so.
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
      responses:
        "204": { description: Decided }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/appeals:
    get:
      tags: [moderation]
      operationId: listOverdueAppeals
      summary: Appeals past their SLA
      description: |
        Overdue only, rather than everything sorted by age. The failure mode of an
        appeals process is not that appeals are decided wrongly - it is that they
        are never decided, and a queue showing every open appeal buries the
        breached ones among them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OverdueAppeal" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/appeals/{appealId}/decide:
    post:
      tags: [moderation]
      operationId: decideAppeal
      parameters:
        - name: appealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overturn]
              properties:
                overturn: { type: boolean }
                note: { type: string }
      responses:
        "204": { description: Decided }
        "403":
          description: The original reviewer cannot decide an appeal against their own decision
        "409": { description: Already decided }

  # -- Phase 9 . boosts --------------------------------------------------------
  #
  # Three rules constrain this surface, and each costs revenue. They are in
  # docs/PHASE-9-BOOSTS.md §1 and are repeated in the endpoint descriptions
  # below because they are the ones a future change is most likely to relax:
  #
  #   1. A boosted reel passes the same hard filters as an organic one.
  #      Targeting narrows where a reel appears; it never widens it past where
  #      the vendor delivers.
  #   2. Paid slots never come out of the exploration slice.
  #   3. Sponsored engagement does not feed the ranker.

  /boosts:
    post:
      tags: [boosts]
      operationId: createCampaign
      summary: Open a draft campaign
      description: |
        Draft, not active. Three things must happen before a single impression is
        served — the advertiser pays, a human reviews the campaign, and the
        schedule starts — and collapsing any of them into creation is how an
        unreviewed video reaches a feed.

        `bid_cpm_minor` is checked against the published rate-card floor.
        `daily_cap_minor` must not exceed `funded_minor`: a campaign funded with
        200 AED and a daily cap of 500 is not a campaign, it is one day of
        spending with a misleading label.

        **Targeting narrows and never widens.** A vendor who sets a 50 km radius
        does not thereby deliver to 50 km — the reel's own service-area coverage
        still applies, in the same query, always. There is no field here that
        relaxes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reel_id, bid_cpm_minor, funded_minor, daily_cap_minor, starts_on]
              properties:
                reel_id:
                  type: string
                  format: uuid
                  description: Must already be published. A campaign cannot buy its way past moderation.
                vendor_id:
                  type: string
                  format: uuid
                  description: Omit for a private seller's own campaign. Authorised through vendor_users when present.
                objective: { type: string, enum: [reach, conversion] }
                bid_cpm_minor: { type: integer, description: Per thousand impressions }
                funded_minor: { type: integer, format: int64 }
                daily_cap_minor: { type: integer, format: int64 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                targeting:
                  type: object
                  description: Every field narrows. None widens.
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                    radius_m: { type: integer, minimum: 500, maximum: 100000 }
                    emirates: { type: array, items: { type: string } }
                    category_ids: { type: array, items: { type: string, format: uuid } }
                    locales: { type: array, items: { type: string, enum: [en, ar] } }
                    hours_of_day:
                      type: array
                      items: { type: integer, minimum: 0, maximum: 23 }
                      description: Local time. Restaurants buy iftar; that is a two-hour window.
                    days_of_week: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  next: { type: string }
                  note: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The reel is not published }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    get:
      tags: [boosts]
      operationId: listCampaigns
      summary: Campaign performance
      description: |
        Impressions and spend. Deliberately **no conversion number** — clicks and
        orders already have a home in the Phase 3 funnel, and a second conversion
        figure computed a different way in the ad console is exactly what
        PHASE-3 §4 warns about: two numbers for one question, and whoever is
        presenting picks the flattering one.

        `conversion_at` points at the endpoint that does answer it.
      parameters:
        - name: vendor_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CampaignReport" }
                  conversion_at: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /boosts/{campaignId}/status:
    post:
      tags: [boosts]
      operationId: setCampaignStatus
      summary: Pause or resume
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, completed] }
      responses:
        "204": { description: Updated }
        "404":
          description: Not found. Returned rather than 403 for a campaign the caller does not own, because a 403 confirms it exists.
        "409": { description: The campaign cannot reach that state from its current one }

  /moderation/boosts/{campaignId}/decide:
    post:
      tags: [boosts]
      operationId: reviewCampaign
      summary: Approve or reject a campaign
      description: |
        Not a second content review — the reel was moderated before it could be
        published. This reviews the *campaign*: is a vendor paying to amplify a
        reel about something they are licensed to sell, is the targeting sane, is
        this a competitor's video. Different question, different queue.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                note: { type: string, description: Required on rejection }
      responses:
        "204": { description: Decided }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Not awaiting review }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # -- Staff review queues -----------------------------------------------------
  #
  # Added when the admin panel was built, and their absence was the finding:
  # this API had nine `decide` endpoints and five `queue` endpoints. A decide
  # endpoint with no queue behind it can only be reached by someone who already
  # knows the id, which means the work never reaches a reviewer at all.
  #
  # Every one of these checks `platform_admins` on the server, on every call,
  # rather than reading a claim from the token. Granting staff access takes
  # effect immediately and so does revoking it.

  /moderation/queues:
    get:
      tags: [moderation]
      operationId: getQueueDepths
      summary: Every review queue's depth in one call
      description: |
        Returns all ten queues including the empty ones. A queue that disappears
        from a dashboard when it empties is one whose sudden reappearance nobody
        notices.

        `oldest_seconds` matters more than `waiting`: a deep and *young* queue is
        a busy afternoon, a shallow and *old* one is a queue nobody is working,
        and only the second is an incident. `sla_seconds` travels with each row
        so the client renders the deadline this system actually promises rather
        than one a designer picked.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items: { $ref: "#/components/schemas/QueueDepth" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/listings:
    get:
      tags: [moderation]
      operationId: listListingQueue
      summary: Vehicle listings awaiting review
      description: |
        The VIN, the price and the seller's trust band come with each row.
        PHASE-6 §2 said a listing decision "needs the VIN and the price history
        in front of it"; a queue that returns titles and ids makes that a second
        request per row, and the second request is the one nobody makes at forty
        listings an hour.

        Trust is keyed on the *user*, not the listing's seller kind — a dealer's
        signals attach to the person who owns the account, which is what makes a
        fraudster's second dealership visible.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ListingQueueItem" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /kyc/cases:
    get:
      tags: [moderation]
      operationId: listKycQueue
      summary: Identity checks awaiting a decision
      description: |
        Documents come back with the case rather than behind a second call — a
        reviewer decides by looking at the evidence, and a screen that lists
        cases then fetches documents per row turns one decision into two round
        trips.

        `document_ref` is a reference into object storage, never the document
        and never an image URL. A scan of an Emirates ID is the highest-value
        object in this system to an attacker.

        `expired` is computed server-side. Approving a case backed by a licence
        that lapsed last week is the failure that flag exists to make impossible
        to miss.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KycCase" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payout-accounts:
    get:
      tags: [payouts]
      operationId: listPendingPayoutAccounts
      summary: Bank accounts awaiting the name check
      description: |
        Returns the legal name on record and the name on the account, side by
        side and **uncompared**. Deciding whether they are the same entity is the
        reviewer's whole job, and a fuzzy match that is right 90% of the time
        would be wrong exactly where it matters — payout redirection is the most
        common fraud against a marketplace, and the attacker picks a name that
        nearly matches.

        The IBAN is masked. The check digits were validated when it was stored.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PendingPayoutAccount" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /moderation/boosts:
    get:
      tags: [boosts]
      operationId: listCampaignQueue
      summary: Campaigns awaiting review
      description: |
        Everything here is funded and idle — the advertiser has paid and nothing
        is running, which is the worst state available because a rejection at
        least gets refunded.

        Targeting is rendered as a sentence server-side. The reviewer's question
        is "is this sane", and eight nullable columns is not the shape that
        answers it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PendingCampaign" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated UUID. Replaying a key with an identical request body returns
        the original response; replaying it with a different body is a 422.
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FromDate:
      name: from
      in: query
      required: false
      description: Inclusive. Defaults to 30 days ago.
      schema: { type: string, format: date }
    ToDate:
      name: to
      in: query
      required: false
      description: Inclusive of the named day. Defaults to today.
      schema: { type: string, format: date }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FulfillmentId:
      name: fulfillmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or revoked credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Authenticated, but not permitted. Distinct from 404 on purpose where the
        caller already knows the resource exists — a vendor dashboard that gets a 404
        for a branch it just listed cannot tell a permissions problem from a bug.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource, or not visible to this caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Well-formed but semantically invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:

    QueueDepth:
      type: object
      properties:
        queue:
          type: string
          enum: [reel, comment, message, listing, fraud, appeal, kyc, payout_account, dispute, boost]
        waiting: { type: integer }
        oldest_seconds: { type: integer }
        sla_seconds: { type: integer }
        sla_breached: { type: boolean }

    ListingQueueItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        seller_kind: { type: string, enum: [user, dealer] }
        seller_id: { type: string, format: uuid }
        seller_name: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }
        price: { $ref: "#/components/schemas/Money" }
        mileage_km: { type: integer }
        vin: { type: [string, "null"] }
        regional_spec: { type: string }
        city: { type: [string, "null"] }
        photo_key: { type: [string, "null"] }
        submitted_at: { type: string, format: date-time }
        trust:
          type: object
          properties:
            score: { type: number }
            band: { type: string }

    KycDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        document_ref:
          type: [string, "null"]
          description: An object-storage reference. Never the document, never an image URL.
        number_last4: { type: [string, "null"] }
        issued_on: { type: [string, "null"], format: date }
        expires_on: { type: [string, "null"], format: date }
        status: { type: string, enum: [pending, verified, rejected] }
        expired: { type: boolean }

    KycCase:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string, enum: [vendor, user, driver] }
        subject_id: { type: string, format: uuid }
        subject_name: { type: string }
        tier: { type: string, enum: [basic, verified, enhanced] }
        status: { type: string }
        created_at: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/KycDocument" }

    PendingPayoutAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string, enum: [vendor, driver] }
        owner_id: { type: string, format: uuid }
        owner_name: { type: string, description: The legal name on the identity check }
        holder_name: { type: string, description: The name on the bank account }
        iban: { type: string, description: Masked }
        bank_name: { type: [string, "null"] }
        currency: { type: string }
        created_at: { type: string, format: date-time }

    PendingCampaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        advertiser_type: { type: string, enum: [vendor, user] }
        advertiser_name: { type: string }
        reel_id: { type: string, format: uuid }
        caption: { type: string }
        poster_key: { type: string }
        bid_cpm: { $ref: "#/components/schemas/Money" }
        funded: { $ref: "#/components/schemas/Money" }
        daily_cap: { $ref: "#/components/schemas/Money" }
        starts_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
        targeting: { type: string, description: Rendered as a sentence, not as fields }

    CampaignReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: BST-2608-K7M2QX }
        status:
          type: string
          enum: [draft, pending_review, active, paused, exhausted, completed, rejected]
        impressions:
          type: integer
          format: int64
          description: Confirmed views, not served impressions. A prefetched page nobody rendered bills nobody.
        spent: { $ref: "#/components/schemas/Money" }
        funded: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/Money" }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        key: { type: string }
        category: { type: string, enum: [transactional, delivery, account, moderation, marketing] }
        body: { type: string }
        read: { type: boolean }

    InvoiceSummary:
      type: object
      description: |
        `supply_date` is the tax point and is not the issue date. An order
        delivered on 31 December and invoiced on 2 January belongs to the earlier
        tax period; an accountant reconciling a quarter needs the first date and
        nothing else on this object tells them what it was.
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: INV-AE-2026-000117 }
        kind: { type: string, enum: [tax_invoice, simplified, credit_note] }
        total: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money" }
        supply_date: { type: string, format: date }
        issued_at: { type: string, format: date-time }
        status: { type: string, enum: [issued, cancelled, superseded] }

    OverdueAppeal:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        appellant_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        overdue_by_hours: { type: integer }
    # RFC 9457 problem details. One error shape for the whole API.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          description: Field-level detail for validation failures.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }

    Money:
      type: object
      description: Integer minor units. `1250` + `AED` is 12.50 AED.
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3, examples: ["AED", "SAR"] }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Locale:
      type: string
      enum: [en, ar]

    # --- auth ---
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164, including country code.
          pattern: '^\+[1-9]\d{7,14}$'
          examples: ["+971501234567"]
        purpose: { type: string, enum: [login, verify_phone], default: login }
        locale: { $ref: "#/components/schemas/Locale" }

    OtpChallenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        resend_after_seconds: { type: integer }

    OtpVerification:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, minLength: 4, maxLength: 8 }
        device:
          type: object
          properties:
            platform: { type: string, enum: [ios, android, web] }
            name: { type: string }
            push_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, default: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds. }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, phone, locale, status, created_at]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: [string, "null"], format: email }
        display_name: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        status: { type: string, enum: [active, suspended, deleted] }
        created_at: { type: string, format: date-time }

    # --- addresses ---
    AddressInput:
      type: object
      description: |
        GCC addressing is landmark-based. A postcode-driven form fails here — `landmark`
        carries more routing value than `street` in most of the region.
      required: [label, city, country, point]
      properties:
        label: { type: string, examples: ["Home", "Office"] }
        recipient_name: { type: string }
        recipient_phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        building: { type: string }
        flat: { type: string }
        street: { type: string }
        landmark: { type: string }
        area: { type: string, description: "District / community, e.g. Al Barsha 1." }
        city: { type: string }
        emirate: { type: string, description: "Emirate (UAE) or region (KSA)." }
        country: { type: string, minLength: 2, maxLength: 2, examples: ["AE", "SA"] }
        point: { $ref: "#/components/schemas/GeoPoint" }
        notes: { type: string }

    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string, format: uuid }
            is_default: { type: boolean }
            created_at: { type: string, format: date-time }

    # --- catalog ---
    Vendor:
      type: object
      required: [id, slug, trade_name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        trade_name: { type: string }
        trade_name_ar: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, suspended] }
        rating: { type: [number, "null"] }
        rating_count: { type: integer }
        branches:
          type: array
          items: { $ref: "#/components/schemas/VendorBranch" }

    VendorBranch:
      type: object
      description: |
        Capacity, service areas and operating hours attach to the **branch**, not the
        vendor. A laundry chain has three facilities with independent catchments.
      required: [id, vendor_id, name, timezone]
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string, format: uuid }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        timezone: { type: string, examples: ["Asia/Dubai"] }
        point: { $ref: "#/components/schemas/GeoPoint" }
        is_active: { type: boolean }

    ServiceOffering:
      type: object
      required: [id, branch_id, service_type, name, base_price, is_active]
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        service_type: { type: string, description: "Strategy registry key." }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        description: { type: [string, "null"] }
        base_price: { $ref: "#/components/schemas/Money" }
        price_is_estimate:
          type: boolean
          description: |
            True when the final amount is only known after handling — laundry priced by
            weight, for example. The client must show an estimate, not a total.
        lead_time_minutes: { type: integer }
        image_url: { type: [string, "null"], format: uri }
        is_active: { type: boolean }

    # --- availability ---
    AvailabilityDay:
      type: object
      required: [date, windows]
      properties:
        date: { type: string, format: date }
        windows:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityWindow" }

    AvailabilityWindow:
      type: object
      required: [window_id, starts_at, ends_at, remaining]
      properties:
        window_id: { type: string, format: uuid }
        starts_at: { type: string, description: "Local wall-clock HH:MM in the branch timezone.", examples: ["08:00"] }
        ends_at: { type: string, examples: ["10:00"] }
        remaining: { type: integer, minimum: 0 }
        surcharge:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    # --- orders ---
    OrderInput:
      type: object
      required: [branch_id, address_id, lines, schedule]
      properties:
        branch_id: { type: string, format: uuid }
        address_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [offering_id, quantity]
            properties:
              offering_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              options:
                type: object
                additionalProperties: true
                description: Vertical-specific selections, validated by the service type's strategy.
        schedule:
          type: object
          description: |
            One entry per fulfillment the vertical requires. A laundry order supplies
            two (pickup and delivery); a single-visit service supplies one. The count
            is validated against the service type's fulfillment pattern.
          required: [slots]
          properties:
            slots:
              type: array
              minItems: 1
              items:
                type: object
                required: [kind, date, window_id]
                properties:
                  kind: { type: string, enum: [pickup, delivery, visit] }
                  date: { type: string, format: date }
                  window_id: { type: string, format: uuid }
        notes: { type: string }
        source:
          type: object
          description: |
            Attribution. Present when the order originated from a reel — this is the
            conversion signal Phase 3 depends on, so the field exists from Phase 1
            even though nothing writes it yet.
          properties:
            reel_id: { type: [string, "null"], format: uuid }
            action_id: { type: [string, "null"], format: uuid }

    Order:
      type: object
      required: [id, order_no, status, branch_id, lines, fulfillments, quote, created_at]
      properties:
        id: { type: string, format: uuid }
        order_no: { type: string, examples: ["AE-2K7F4M"] }
        status:
          type: string
          enum: [pending_payment, confirmed, in_progress, completed, cancelled, failed]
        branch_id: { type: string, format: uuid }
        vendor: { $ref: "#/components/schemas/Vendor" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        fulfillments:
          type: array
          items: { $ref: "#/components/schemas/Fulfillment" }
        quote: { $ref: "#/components/schemas/PriceQuote" }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    OrderLine:
      type: object
      description: |
        Name and price are **snapshots** taken when the order was placed. Never render
        from the offering — a vendor's later price change must not rewrite history.
      required: [id, offering_id, name_snapshot, unit_price_snapshot, quantity]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        name_snapshot: { type: string }
        unit_price_snapshot: { $ref: "#/components/schemas/Money" }
        quantity: { type: integer }
        options:
          type: object
          additionalProperties: true

    Fulfillment:
      type: object
      description: |
        The atomic unit of physical work: someone goes somewhere at a time to do a
        thing. Logistics operates on this shape alone and never learns what a laundry
        or a meal is.
      required: [id, kind, status, scheduled_date, window]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pickup, delivery, visit] }
        status:
          type: string
          enum: [scheduled, dispatched, en_route, arrived, completed, failed, cancelled]
        sequence: { type: integer, description: "Ordering within the parent order, 1-based." }
        scheduled_date: { type: string, format: date }
        window: { $ref: "#/components/schemas/AvailabilityWindow" }
        address: { $ref: "#/components/schemas/Address" }
        completed_at: { type: [string, "null"], format: date-time }

    PriceQuote:
      type: object
      description: |
        Price is a state machine, not a column:
        `estimated → authorized → adjusted → captured → refunded`.
        Laundry priced by weight is `adjusted` after pickup — the model must carry that
        natively rather than treating it as an exception.
      required: [id, state, version, subtotal, tax_total, total]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [estimated, authorized, adjusted, captured, refunded, void] }
        version: { type: integer }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount_total: { $ref: "#/components/schemas/Money" }
        delivery_total: { $ref: "#/components/schemas/Money" }
        tax_total: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        tax_inclusive:
          type: boolean
          description: |
            True in GCC markets — displayed prices already contain VAT. `tax_total` is
            the extracted portion of `total`, not an addition to it.
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuoteLine" }

    QuoteLine:
      type: object
      required: [kind, label, amount]
      properties:
        kind: { type: string, enum: [item, delivery, surcharge, discount, tax] }
        label: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        tax_rate_bp:
          type: [integer, "null"]
          description: Basis points. 500 = 5% (UAE), 1500 = 15% (KSA).

    PaymentIntent:
      type: object
      required: [id, status, amount, provider]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requires_action, authorized, failed] }
        amount: { $ref: "#/components/schemas/Money" }
        provider: { type: string, examples: ["checkout", "stripe", "tap"] }
        client_secret: { type: [string, "null"] }
        redirect_url: { type: [string, "null"], format: uri }

    # ------------------------------------------------------------- Phase 2 --

    ReelUpload:
      type: object
      required: [reel_id, asset_id, upload_url, upload_headers, expires_at]
      properties:
        reel_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        upload_headers:
          type: object
          description: Send these verbatim on the PUT. They are part of the signature.
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    ReelState:
      type: string
      description: |
        The reel lifecycle. Transitions are enforced in one place server-side; a
        client should treat any state it does not recognise as "still processing".
      enum:
        - draft
        - uploaded
        - probing
        - transcoding
        - moderating
        - review_pending
        - approved
        - published
        - rejected
        - removed
        - failed
        - expired

    ReelMetadata:
      type: object
      properties:
        caption: { type: string, maxLength: 2200 }
        caption_locale: { type: string, enum: [ar, en, mixed] }
        category_id: { type: [string, "null"], format: uuid }
        tags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 64 }
        visibility: { type: string, enum: [public, unlisted, private], default: public }
        subject_type: { type: [string, "null"], enum: [service_offering, meal_plan, vehicle_listing, null] }
        subject_id: { type: [string, "null"], format: uuid }

    AuthorReel:
      type: object
      description: |
        The author's view. Carries the failure reason, which the feed representation
        deliberately does not — a rejected vendor who is told only "rejected" has no
        way to fix it, and that is the most common complaint about every content
        platform.
      required: [id, state, visibility]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/ReelState" }
        visibility: { type: string, enum: [public, unlisted, private] }
        caption: { type: string }
        tags:
          type: array
          items: { type: string }
        poster_key: { type: [string, "null"] }
        preview_key: { type: [string, "null"] }
        lqip:
          type: [string, "null"]
          description: BlurHash or base64 micro-thumb, inline so the client paints before any fetch resolves.
        duration_ms: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        failure:
          type: [object, "null"]
          properties:
            code: { type: string }
            detail: { type: string }

    Rendition:
      type: object
      required: [label, width, height, bitrate_kbps, playlist_url]
      properties:
        label:
          type: string
          enum: ["360p", "540p", "720p"]
          description: Capped at 720p. 1080p roughly doubles egress for a difference nobody sees on a phone.
        width: { type: integer }
        height: { type: integer }
        bitrate_kbps: { type: integer }
        playlist_url: { type: string, format: uri }

    ReelCounters:
      type: object
      description: |
        Read from the hot store with a Postgres fallback, so they lag by up to the
        flush interval (~10s). Never treat them as transactionally consistent.
      properties:
        views: { type: integer, format: int64 }
        likes: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
        saves: { type: integer, format: int64 }

    FeedItem:
      type: object
      required: [id, author, renditions, published_at]
      properties:
        id: { type: string, format: uuid }
        author:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [vendor_branch, user] }
            id: { type: string, format: uuid }
            name: { type: string }
        subject_type: { type: [string, "null"] }
        subject_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid }
        caption: { type: string }
        duration_ms: { type: integer }
        poster_key: { type: string }
        preview_key: { type: string }
        lqip: { type: string }
        renditions:
          type: array
          items: { $ref: "#/components/schemas/Rendition" }
        counters: { $ref: "#/components/schemas/ReelCounters" }
        published_at: { type: string, format: date-time }
        explore:
          type: boolean
          default: false
          description: |
            This slot was reserved for exploration rather than earned on score.
            Surfaced so the impression it produces can be told apart from an earned
            one — without that distinction exploration's cost is unmeasurable, and
            the first cost-cutting exercise deletes it.
        viewer:
          type: object
          description: |
            This viewer's relationship to the reel. Absent values are false for
            anonymous viewers. Answered from the relation tables rather than from a
            counter: a badge that is 3% low for ten seconds costs nothing, while a
            heart that un-fills when you scroll away and back is immediately wrong to
            the one person who knows the answer.
          properties:
            liked: { type: boolean }
            saved: { type: boolean }
            followed: { type: boolean }
        time_signal:
          oneOf:
            - $ref: "#/components/schemas/TimeSignal"
            - type: "null"
        summary:
          oneOf:
            - $ref: "#/components/schemas/SubjectSummary"
            - type: "null"

    TimeSignal:
      type: object
      required: [mode, as_of]
      description: |
        When the thing this reel is about stops being true.

        **Carries instants, never rendered text.** There is no `label` and there
        will not be one: a server-rendered "02:04 left" is wrong the moment it is
        serialised — the page may be cached, the client may background for twenty
        minutes and come back, and the same bytes are served to an English and an
        Arabic viewer whose digits differ. The server states when things happen;
        the client states how long that is from now. Same call the API already
        makes for money.

        The feed does not compose this and does not branch on it. It comes from
        the vertical that owns the subject, through `internal/seam/subject`.
      properties:
        mode:
          type: string
          enum: [countdown, window, freshness, cutoff]
          description: |
            How to render the passage of time. Distinguished by what the viewer
            is being told, not by which fields are set:

            | mode | meaning | reads as |
            |---|---|---|
            | `countdown` | this ends and is then gone | "02:04 left" |
            | `window` | true between two times | "1h 48m of 3h" |
            | `freshness` | has been true for a while | "listed 3d ago" |
            | `cutoff` | act before the next boundary | "order by 16:00" |

            `countdown` and `window` carry the same fields and are still two
            modes: a countdown drains, a window fills. Deriving that in the
            client from how far away `ends_at` is gets a three-hour auction wrong.
        starts_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the interval opened. Present for `window` and `freshness`;
            optional for `countdown`, where it only gives the bar a denominator.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: |
            When it closes. Present for every mode but `freshness`, which has no
            end — a listing does not expire because it got old.

            For `cutoff` this is the *next* occurrence, already resolved to an
            instant. See `recurring`.
        horizon_seconds:
          type: [integer, "null"]
          description: |
            The bar's denominator when the interval does not supply a useful one.

            A plate auction opens nine days before it closes, and a bar drawn
            across nine days does not visibly move during the two minutes anyone
            is watching. The vertical picks the span over which urgency is
            legible; draw across that and saturate before it.

            Always present for `freshness`, where it is the decay span — three
            days old is fresh for property and stale for a restaurant offer, and
            only the vertical knows which.
        timezone:
          type: [string, "null"]
          description: |
            IANA name, present for `cutoff`. Not an offset: "order by 16:00" is a
            rule in the vendor's wall clock, and an offset is correct only until
            the first DST boundary in a market that observes one.
        recurring:
          type: boolean
          default: false
          description: |
            The boundary comes back. Decides what the client does when the clock
            runs out — a countdown that expires removes the reel; a cutoff that
            passes rolls to the next cycle and the CTA stays live. Without this
            the client picks one behaviour and it is wrong for half the feed.
        as_of:
          type: string
          format: date-time
          description: |
            The server's clock when the page was built. **Clients must apply it.**

            Compute `skew = as_of - deviceNow` once per page and offset every
            countdown on it. Device clocks are wrong: a phone four minutes fast
            renders a live auction as already closed and the user concludes the
            app is broken; four minutes slow lets someone tap "bid" into a closed
            lot and eat a 409.

    SubjectSummary:
      type: object
      description: |
        The badge over the video and the lines above the CTA, composed entirely
        by the owning vertical. The feed does not know that 64,000 is a kilometre
        reading or that AED 480 is weekly — the moment it does, adding a vertical
        means changing the feed.
      properties:
        badge:
          type: string
          description: |
            Names the *kind* of thing — "USED CAR · VERIFIED", "MEAL
            SUBSCRIPTION". This is what lets a viewer parse a reel in the third
            of a second before deciding to scroll past.
        badge_ar: { type: string }
        title:
          type: string
          description: What it is. "2021 Nissan Patrol LE".
        title_ar: { type: string }
        line:
          type: string
          description: |
            The facts that qualify it — "64,000 km · GCC · Al Quoz". Pre-joined
            by the vertical, separators included: returned as an array the client
            would re-join with a middot that is wrong in RTL.
        line_ar: { type: string }
        price_minor:
          type: [integer, "null"]
          format: int64
          description: |
            Minor units, formatted at the edge. Zero with a currency set is free;
            a null currency means this subject has no price to show, which is not
            the same thing.
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        price_suffix:
          type: string
          description: |
            The unit the price is per — "/wk", "/mo". Separate from the number so
            it can be rendered smaller, and so a locale that puts the unit first
            still can.
        price_suffix_ar: { type: string }

    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        surface:
          type: string
          enum: [for_you, live_now, ending_soon, nearby]
          description: |
            Which surface actually produced this page. Echoed rather than assumed,
            because the server defaults an unrecognised request: without it a
            client that asked for a retired tab would label a For you page as
            Live now.
        empty_reason:
          type: [string, "null"]
          enum: [nothing_live, nothing_closing, nothing_near, nothing_eligible, null]
          description: |
            Why `items` is empty, or null when it is not.

            The client cannot infer this: "no reels" and "no reels *that are
            live*" are the same empty array, and only the server knows which
            question was asked. It matters because "nothing is live right now" is
            a true statement about a working product and the generic empty state
            reads as a broken one — which decides whether the viewer tries
            another tab or closes the app.
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque, and never an offset. Do not parse it: the format already changed
            once, between Phase 2 and Phase 4.

            It carries the page index and the reels already served. The exclusion set
            travels in the cursor rather than living only in Redis so that pagination
            stays correct when Redis is absent or has evicted — otherwise a
            deployment without it returns page 1 forever.
        ranking_profile:
          type: string
          description: |
            Which weight set produced this page. Returned so that "the feed looked
            wrong at 14:20" is answerable rather than debatable.

    ClientEvent:
      type: object
      required: [type, occurred_at]
      properties:
        type:
          type: string
          enum:
            - view_start
            - view_progress
            - like
            - unlike
            - comment
            - share
            - save
            - unsave
            - skip
            - action_click
        reel_id: { type: [string, "null"], format: uuid }
        occurred_at:
          type: string
          format: date-time
          description: Client clock. Kept alongside server receipt time so an offline backlog is visible.
        watched_ms:
          type: integer
          description: On view_progress. The server applies the ≥2000ms view definition.
        completed:
          type: boolean
          default: false
          description: |
            Reported separately from `watched_ms`, deliberately. "Did they watch it"
            and "did they finish it" answer different questions and the ranker
            weights them differently; conflating them misleads the ranking work.
        properties:
          type: object
          additionalProperties: true

    SubscriptionCreated:
      type: object
      required: [id, status, start_date, order_id, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        subscription_no:
          type: string
          description: Human-quotable. Support reads this over the phone.
        status:
          type: string
          enum: [pending_payment, active, paused, suspended, cancelled, completed]
        start_date: { type: string, format: date }
        order_id:
          type: string
          format: uuid
          description: |
            The billing order for the first cycle. Pay it with
            `POST /v1/orders/{orderId}/payment-intent` — the same call a one-off
            order uses.
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        first_cycle:
          type: object
          properties:
            cycle_no: { type: integer }
            starts_on: { type: string, format: date }
            ends_on: { type: string, format: date }
            deliverable_days:
              type: integer
              description: |
                Delivery days in this cycle, frozen when it opens. It is the divisor
                for daily revenue recognition, and freezing it means a mid-cycle
                pause cannot retroactively change the rate applied to days already
                recognised.
        next_step:
          type: string
          description: Stated explicitly because nothing is delivered until the order is paid.

    Comment:
      type: object
      required: [id, reel_id, author_id, body, state, created_at]
      properties:
        id: { type: string, format: uuid }
        reel_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        depth:
          type: integer
          enum: [0, 1]
          description: Threads are two levels deep by construction.
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string }
        state:
          type: string
          enum: [pending, published, rejected, removed]
          description: |
            A comment is invisible until something has judged it. There is no path
            that creates a visible comment directly.
        reason:
          type: string
          description: |
            Why it was rejected, shown to its author. "Your comment was removed" with
            no reason is the most common complaint about every platform that has
            comments, and it turns a correct decision into a grievance.
        reply_count:
          type: integer
          description: Root comments only.
        created_at: { type: string, format: date-time }

    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_before:
          type: string
          format: date-time
          description: |
            Keyset on the oldest **root** in this page, not the oldest row. Replies
            are fetched under their parent, so paginating on a reply's timestamp
            would skip every root published between it and its parent.

    CommentQueueItem:
      type: object
      required: [id, reel_id, body, state, created_at]
      properties:
        id: { type: string, format: uuid }
        reel_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string }
        state: { type: string, enum: [pending, published, rejected, removed] }
        reports: { type: integer }
        created_at: { type: string, format: date-time }
        waiting_seconds: { type: integer }
        sla_breached: { type: boolean }

    RankingProfile:
      type: object
      required: [profile, weights]
      properties:
        profile:
          type: string
          description: The active row's name, or "default (compiled-in)".
        weights:
          type: object
          description: |
            Every score term multiplies a *lift over baseline*, not a raw rate. Order
            rates run near 0.2% and engagement rates near 5%, so a linear combination
            of raw rates would let engagement dominate at any weight — and whoever
            turned `conversion` up would watch nothing happen.
          properties:
            conversion:
              type: number
              description: |
                Verified orders per impression. Largest by design: the north star is
                transactions per weekly active user, and watch time is the easier
                number to move.
            intent: { type: number, description: CTA presses per impression. }
            engagement: { type: number, description: Weighted like/comment/share/save rate. }
            author_quality: { type: number, description: The prior a new reel inherits. }
            recency: { type: number }
            affinity: { type: number, description: "Viewer category affinity, in [-1, 1]." }
            followed_author: { type: number }
            proximity:
              type: number
              description: |
                Breaks ties among vendors who can all serve the address. Deliverability
                is a hard filter, never a soft signal.
            recency_half_life_hours: { type: number }
            proximity_half_km: { type: number }
            prior_events:
              type: number
              description: |
                Bayesian prior strength in **events**, not impressions. Stated as
                impressions, the pseudo-count for a rare event is a fraction of one
                order and a single real order swamps it — which is exactly the reel
                the smoothing exists to hold back.
            prior_click_rate: { type: number }
            prior_order_rate: { type: number }
            prior_engagement_rate: { type: number }
            takedown_penalty: { type: number }
            reject_penalty: { type: number }
            exploration_share:
              type: number
              description: |
                Fraction of every page reserved for reels that have not had a fair
                hearing. Zero means new vendors never get impressions and the supply
                side churns — a failure invisible from every demand-side metric.
            exploration_impression_floor: { type: integer }
        notes: { type: string }

    ModerationQueueItem:
      type: object
      required: [reel_id, entered_at]
      properties:
        reel_id: { type: string, format: uuid }
        author_type: { type: string, enum: [vendor_branch, user] }
        author_id: { type: string, format: uuid }
        caption: { type: string }
        poster_key: { type: string }
        categories:
          type: array
          items: { type: string }
        tier:
          type: string
          enum: [new, probation, trusted, flagged]
          description: Author trust tier. Drives how much of this author's content is reviewed at all.
        reports: { type: integer }
        entered_at: { type: string, format: date-time }
        waiting_seconds: { type: integer }
        sla_breached:
          type: boolean
          description: True past the two-hour review SLA. Surfaced here so a breach is visible in the tool the moderator already has open.

    # ------------------------------------------------------------- Phase 3 --

    ActionKind:
      type: string
      description: |
        The complete vocabulary the feed has for commerce. Adding a vertical means
        registering a kind and its handler — never touching feed, ranking or
        moderation code.
      enum:
        - book_service
        - subscribe_plan
        - inquire_listing
        - open_menu
        - follow
        - share
        - external

    ActionTargetType:
      type: string
      enum:
        - service_offering
        - meal_plan
        - vehicle_listing
        - vendor_branch
        - vendor
        - url

    ActionInput:
      type: object
      required: [kind, target_type]
      properties:
        kind: { $ref: "#/components/schemas/ActionKind" }
        target_type: { $ref: "#/components/schemas/ActionTargetType" }
        target_id:
          type: [string, "null"]
          format: uuid
          description: Required for every target type except `url`.
        target_url:
          type: [string, "null"]
          format: uri
          description: |
            Required when `target_type` is `url`. Only http and https are accepted —
            a CTA is a link a vendor supplies and a customer taps inside our app.
        label: { type: string, maxLength: 40 }
        label_ar: { type: string, maxLength: 40 }

    ResolvedAction:
      type: object
      description: |
        A CTA as the client renders it. `label`, `available` and `reason` come from
        the owning vertical's handler; the feed itself never learns what the target
        is.
      required: [id, kind, target_type, available]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ActionKind" }
        target_type: { $ref: "#/components/schemas/ActionTargetType" }
        target_id: { type: string, format: uuid }
        position: { type: integer }
        label: { type: string }
        label_ar: { type: string }
        available: { type: boolean }
        reason:
          type: [string, "null"]
          description: |
            Shown when `available` is false. Always populated in that case — a
            greyed-out button with no explanation reads as a broken app, and the
            vendor gets blamed for a platform decision.
        route:
          type: string
          description: Client-side deep link, or an absolute URL for `external`.
        meta:
          type: [object, "null"]
          additionalProperties: true

    AttributionModel:
      type: string
      description: |
        Which rule credited an order to a reel. Stored per row, because the rules
        will change and a historical number is only interpretable under the rule
        that produced it.

        `last_click` is the only model backed by something the server observed.
        The others are reported beside it, never merged into it.
      enum:
        - last_click
        - declared
        - view_through
        - none

    AttributedOrders:
      type: object
      description: |
        Split by model and never summed into one "orders" figure. A view-through
        order and a click-through order are different claims about whether the feed
        works, and adding them asserts they are the same claim.
      properties:
        last_click: { type: integer, format: int64 }
        declared: { type: integer, format: int64 }
        view_through: { type: integer, format: int64 }
        organic: { type: integer, format: int64 }

    ReelFunnel:
      type: object
      required: [reel_id, impressions, views, clicks, orders]
      properties:
        reel_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        impressions:
          type: integer
          format: int64
          description: Times the reel was served in a feed page. The denominator egress is spent on.
        views:
          type: integer
          format: int64
          description: ≥2s watched, deduped per (user, reel, session).
        clicks: { type: integer, format: int64 }
        orders: { $ref: "#/components/schemas/AttributedOrders" }
        off_feed_orders:
          type: integer
          format: int64
          description: |
            Arrived by shared or deep link rather than the feed. Reported apart
            because a vendor pushing their own reel to a WhatsApp group converts at
            rates the feed will never approach.
        gmv_last_click_minor:
          type: integer
          format: int64
          description: Verifiable attributions only. A revenue figure nobody can defend is worse than none.
        currency: { type: string }
        rates:
          type: object
          description: Each named for its denominator, so the flattering one cannot be quoted by accident.
          properties:
            clicks_per_impression: { type: number }
            orders_per_click: { type: number }
            orders_per_impression: { type: number }

    FeedFunnel:
      type: object
      required: [impressions, clicks, orders, feed_share_of_orders, definitions]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        impressions: { type: integer, format: int64 }
        clicks: { type: integer, format: int64 }
        orders: { $ref: "#/components/schemas/AttributedOrders" }
        gmv_last_click_minor: { type: integer, format: int64 }
        gmv_total_minor: { type: integer, format: int64 }
        currency: { type: string }
        reels_with_impressions: { type: integer, format: int64 }
        reels_with_any_order: { type: integer, format: int64 }
        feed_share_of_orders:
          type: number
          description: |
            Verifiable click-attributed orders ÷ all orders placed, organic included.
            The conservative reading, computed server-side so everyone quotes the
            same definition.
        definitions:
          type: object
          description: |
            Shipped with the numbers, not in a wiki. The same raw counts support a
            flattering reading and a conservative one; carrying the definitions means
            both parties are arguing about the same thing.
          additionalProperties: true

    # ── Phase 6 · vehicles ──────────────────────────────────────────────────

    RegionalSpec:
      type: string
      description: |
        The single most price-relevant fact about a used car in this market —
        a US-spec and a GCC-spec car of the same year and mileage are different
        products, with different air conditioning, warranty and resale. Required
        on every listing and never defaulted: guessing it would put a claim in
        the advert that the seller never made.
      enum: [gcc, us, japanese, european, canadian, chinese, other]

    ListingDraft:
      type: object
      required: [make, model, year, mileage_km, regional_spec, price_minor, lat, lng]
      properties:
        make: { type: string, description: 'Taxonomy slug, e.g. "nissan"' }
        model: { type: string, description: 'Taxonomy slug, e.g. "patrol"' }
        year:
          type: integer
          description: |
            One model year ahead of the calendar is allowed — cars are sold as next
            year's model from around August. Two years ahead is a typo.
        mileage_km: { type: integer }
        regional_spec: { $ref: "#/components/schemas/RegionalSpec" }
        price_minor: { type: integer, format: int64 }
        currency: { type: string, default: AED }
        vin:
          type: string
          description: |
            17 characters. I, O and Q are absent from the ISO 3779 alphabet so they
            are never confused with 1 and 0. Optional — a private seller may not
            want it public before a serious buyer appears, and refusing the listing
            over it loses supply. A failing check digit raises a fraud signal rather
            than rejecting the listing: the digit is mandatory only for vehicles
            built for North America, so genuine GCC and Japanese imports fail it
            routinely.
        transmission: { type: string, enum: [automatic, manual, cvt, dct, other] }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, plug_in_hybrid, electric] }
        body_type:
          type: string
          enum: [sedan, suv, coupe, hatchback, pickup, van, convertible, wagon, crossover, other]
        title: { type: string }
        description: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        radius_m:
          type: integer
          description: |
            How far a buyer would travel to see this car. Capped at 150 km — the geo
            filter is the product's entire wedge, and a seller who sets it to the
            whole country turns it off.
          default: 50000

    ListingCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference_no:
          type: string
          description: Human-quotable. Support reads it over the phone and buyers screenshot it.
        status: { type: string }
        next_step: { type: string }

    ListingSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference_no: { type: string }
        year: { type: integer }
        mileage_km: { type: integer }
        price_minor: { type: integer, format: int64 }
        currency: { type: string }
        regional_spec: { $ref: "#/components/schemas/RegionalSpec" }
        seller_kind: { type: string, enum: [private, dealer] }
        is_negotiable: { type: boolean }
        title: { type: string }
        emirate: { type: string }
        city: { type: string }
        distance_m: { type: integer, format: int64 }
        published_at: { type: string, format: date-time }
        promoted:
          type: boolean
          description: |
            Paid placement, always labelled. A promoted result that looks organic is
            what makes buyers stop trusting the order — at which point the placement
            is worth nothing to the seller who bought it.

    ListingSearchResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ListingSummary" }
        total: { type: integer, format: int64 }
        limit: { type: integer }

    Inquiry:
      type: object
      properties:
        lead_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }

    Offer:
      type: object
      properties:
        id: { type: string, format: uuid }
        expires_in: { type: string }
        binding:
          type: boolean
          description: Always false. No payment is held and acceptance is not a contract.
        note: { type: string }

    ListingPackage:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        name_ar: { type: string }
        audience: { type: string, enum: [private, dealer] }
        listing_quota: { type: integer }
        duration_days: { type: integer }
        featured_days: { type: integer }
        bump_quota: { type: integer }
        price_minor: { type: integer, format: int64, description: Tax-inclusive }
        currency: { type: string }
        is_recurring: { type: boolean }

    PackagePurchase:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_payment, active, exhausted, expired, refunded, cancelled]
        amount_minor: { type: integer, format: int64, description: Net of VAT }
        tax_minor: { type: integer, format: int64 }
        currency: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    # ── Phase 6 · chat ──────────────────────────────────────────────────────

    ConversationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        listing_title: { type: string }
        counterparty_id: { type: string, format: uuid }
        unread: { type: integer }
        last_message_at: { type: string, format: date-time }
        state: { type: string, enum: [open, archived, blocked, closed] }

    MessageState:
      type: string
      description: |
        `redacted` means contact details were removed and the message was delivered.
        `held` means a person is reviewing it and the recipient has seen nothing.
      enum: [sent, redacted, held, blocked, deleted]

    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        body: { type: string }
        state: { $ref: "#/components/schemas/MessageState" }
        created_at: { type: string, format: date-time }

    SentMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/MessageState" }
        body: { type: string }
        created_at: { type: string, format: date-time }
        message:
          type: string
          description: |
            Present when something was removed or held. Shown to the sender verbatim —
            a silently altered message is the most alienating thing a chat product can
            do, and the sender simply retries until something gets through.
        removed:
          type: array
          description: What kind of content was stripped, for the sender's benefit.
          items:
            type: string
            enum: [phone, email, messaging_handle, external_link]

    HeldMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        body:
          type: string
          description: |
            The original, unredacted. A reviewer judging whether a message is a scam
            needs the text that triggered the hold, not a version with the evidence
            removed.
        findings: { type: array, items: { type: string } }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    # ── Phase 6 · trust ─────────────────────────────────────────────────────

    FraudSignal:
      type: object
      properties:
        subject_type: { type: string, enum: [listing, user, conversation, message] }
        subject_id: { type: string, format: uuid }
        kind: { type: string }
        severity:
          type: integer
          description: 1–100, the detector's confidence in this particular instance.
        score: { type: integer, description: "The subject's current trust score, 0–100" }
        band: { type: string, enum: [ok, watch, restricted, blocked] }
        weight_if_confirmed:
          type: number
          description: |
            Points this signal will cost the subject if confirmed. Shown because a
            reviewer deciding without it is guessing — and because the invariant
            behind the numbers matters: no machine signal blocks an account on its
            own; only a human confirming one does.
        created_at: { type: string, format: date-time }

    # ── Phase 7 · logistics ─────────────────────────────────────────────────

    ManifestStop:
      type: object
      description: |
        One line on a driver's screen. Note what is absent: no item list, no
        product name, no order total, no vertical. Everything here was snapshotted
        onto the fulfillment when it was created — which is the Fulfillment
        primitive's entire argument, expressed as a response body.
      properties:
        fulfillment_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        sequence: { type: integer }
        kind: { type: string, enum: [pickup, delivery, visit] }
        status:
          type: string
          enum: [scheduled, dispatched, en_route, arrived, completed, failed, cancelled]
        address:
          type: object
          properties:
            line: { type: string }
            landmark: { type: string }
            area: { type: string }
            city: { type: string }
            notes: { type: string }
            lat: { type: number, format: double }
            lng: { type: number, format: double }
        recipient_name: { type: string }
        recipient_phone: { type: string }
        window: { type: string }
        eta: { type: string, format: date-time }
        cod_minor: { type: integer, format: int64, description: "Cash to collect. Zero for prepaid work." }
        currency: { type: string }
        attempt_count: { type: integer }
        requires_otp:
          type: boolean
          description: |
            Sent with the manifest, not discovered at completion. A driver who
            learns at the door that they needed a code has already walked away.

    Manifest:
      type: object
      properties:
        date: { type: string, format: date }
        stops:
          type: array
          items: { $ref: "#/components/schemas/ManifestStop" }

    DeliveryProof:
      type: object
      required: [proof]
      properties:
        proof:
          type: string
          description: |
            `left_at_door` is never sufficient — it is named honestly because it
            proves the driver says so and nothing else. Stronger proof than
            required is always accepted; refusing it would train drivers to
            capture the minimum.
          enum: [otp, signature, photo, recipient_name, left_at_door]
        otp: { type: string, description: "Four digits, single-use, scoped to this fulfillment." }
        signature_key: { type: string }
        photo_key: { type: string }
        recipient_name: { type: string }
        note: { type: string }
        collected_minor:
          type: integer
          format: int64
          description: |
            Cash actually taken. May differ from what was expected — the customer
            had no change, or paid part by card. Commission is taken on this
            figure, not on what was owed.
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    BoardRoute:
      type: object
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        driver_name: { type: string }
        status:
          type: string
          enum: [planned, assigned, in_progress, completed, abandoned, cancelled]
        planned_stops: { type: integer }
        completed_stops: { type: integer }
        failed_stops: { type: integer }
        planned_distance_m: { type: integer }
        first_eta: { type: string, format: date-time }
        last_eta: { type: string, format: date-time }
        started_at: { type: string, format: date-time }

    DispatchBoard:
      type: object
      properties:
        date: { type: string, format: date }
        routes:
          type: array
          items: { $ref: "#/components/schemas/BoardRoute" }
        unassigned:
          type: integer
          description: Scheduled work with no route. The board's left-hand column.

    # ── Phase 7 · console ───────────────────────────────────────────────────

    BranchAccess:
      type: object
      properties:
        branch_id: { type: string, format: uuid }
        branch_name: { type: string }
        city: { type: [string, "null"] }
        vendor_id: { type: string, format: uuid }
        vendor_name: { type: string }
        vendor_status: { type: string }
        role: { type: string, enum: [owner, manager, staff] }

    MealSlot:
      type: string
      enum: [breakfast, lunch, dinner, snack, suhoor, iftar]

    Allergen:
      type: string
      enum: [gluten, crustaceans, eggs, fish, peanuts, soy, milk, tree_nuts, celery, mustard, sesame, sulphites, lupin, molluscs]

    DishInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        name_ar: { type: [string, "null"] }
        description: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: https only }
        calories: { type: [integer, "null"], minimum: 0, maximum: 5000 }
        protein_g: { type: [number, "null"], minimum: 0 }
        carbs_g: { type: [number, "null"], minimum: 0 }
        fat_g: { type: [number, "null"], minimum: 0 }
        allergens: { type: array, items: { $ref: "#/components/schemas/Allergen" } }
        tags: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
        is_active: { type: [boolean, "null"], description: Omit to leave unchanged; defaults true on create. }

    Dish:
      allOf:
        - $ref: "#/components/schemas/DishInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            branch_id: { type: string, format: uuid }
            is_active: { type: boolean }
            menu_slots: { type: integer, description: Menu cells currently serving this dish. }

    MenuChoice:
      type: object
      properties:
        dish_id: { type: string, format: uuid }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        allergens: { type: array, items: { $ref: "#/components/schemas/Allergen" } }
        calories: { type: [integer, "null"] }
        image_url: { type: [string, "null"] }
        is_active: { type: boolean }

    WeeklyMenu:
      type: object
      properties:
        cycle_id: { type: [string, "null"], format: uuid }
        slots:
          type: array
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
              slot: { $ref: "#/components/schemas/MealSlot" }
              default: { oneOf: [{ $ref: "#/components/schemas/MenuChoice" }, { type: "null" }] }
              alternative: { oneOf: [{ $ref: "#/components/schemas/MenuChoice" }, { type: "null" }] }

    PlanTierInput:
      type: object
      required: [key, name, price_minor]
      properties:
        key: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" }
        name: { type: string }
        name_ar: { type: [string, "null"] }
        days_per_week: { type: [integer, "null"], minimum: 1, maximum: 7 }
        meals_per_day: { type: [integer, "null"], minimum: 1, maximum: 6 }
        portion_size: { type: [string, "null"], enum: [small, regular, large, null] }
        price_minor: { type: integer, format: int64, minimum: 1 }

    KitchenPlanInput:
      type: object
      required: [name, cycle_days, days_per_week, meal_slots, delivery_weekdays, price_minor]
      properties:
        name: { type: string, maxLength: 120 }
        name_ar: { type: [string, "null"] }
        description: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        cycle_days: { type: integer, minimum: 7, maximum: 365 }
        days_per_week: { type: integer, minimum: 1, maximum: 7, description: At most the number of delivery_weekdays. }
        meal_slots: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MealSlot" } }
        delivery_weekdays: { type: array, minItems: 1, items: { type: integer, minimum: 0, maximum: 6 } }
        allowed_pause_days: { type: integer, minimum: 0 }
        cutoff_hours: { type: integer, minimum: 0, maximum: 168 }
        price_minor: { type: integer, format: int64, minimum: 1, description: Per billing cycle, before VAT. }
        rotation_enabled: { type: boolean }
        rotation_week_price_minor:
          type: [integer, "null"]
          format: int64
          description: |
            This kitchen's price for one week inside a four-kitchen rotation.
            Required when rotation_enabled. A rotation customer pays the sum of
            the four kitchens' weekly prices; commission applies per week.
        is_active: { type: [boolean, "null"] }
        tiers: { type: array, items: { $ref: "#/components/schemas/PlanTierInput" } }

    KitchenPlan:
      allOf:
        - $ref: "#/components/schemas/KitchenPlanInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            branch_id: { type: string, format: uuid }
            meals_per_day: { type: integer, description: Always the number of meal_slots. }
            currency: { type: string }
            tax_rate_bp: { type: integer }
            is_active: { type: boolean }
            active_subscribers: { type: integer }
            tiers:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PlanTierInput"
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      sort_order: { type: integer }
                      is_active: { type: boolean }

    KitchenProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        name_ar: { type: [string, "null"] }
        description: { type: [string, "null"], maxLength: 1000 }
        description_ar: { type: [string, "null"] }
        cuisines: { type: array, items: { type: string } }
        dietary_tags: { type: array, items: { type: string } }
        cover_image_url: { type: [string, "null"], format: uri }
        phone: { type: [string, "null"] }

    KitchenProfile:
      allOf:
        - $ref: "#/components/schemas/KitchenProfileInput"
        - type: object
          properties:
            branch_id: { type: string, format: uuid }
            vendor_id: { type: string, format: uuid }
            vendor_name: { type: string }
            vendor_status: { type: string }
            address_line: { type: [string, "null"] }
            city: { type: [string, "null"] }
            emirate: { type: [string, "null"] }
            timezone: { type: string }
            currency: { type: string }
            is_active: { type: boolean }
            has_service_area: { type: boolean }
            delivery_windows:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
                  starts_at: { type: string, example: "12:00" }
                  ends_at: { type: string, example: "14:00" }

    KitchenOverview:
      type: object
      properties:
        active_subscribers: { type: integer }
        paused_subscribers: { type: integer }
        pending_payment: { type: integer }
        active_plans: { type: integer }
        rotation_plans: { type: integer }
        active_dishes: { type: integer }
        profile_complete: { type: boolean }
        menu_gaps:
          type: array
          description: Weekday/slot cells a live plan delivers but the menu leaves without a default dish.
          items:
            type: object
            properties:
              weekday: { type: integer }
              slot: { $ref: "#/components/schemas/MealSlot" }

    Membership:
      type: object
      properties:
        vendor_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, manager, staff] }
        branch_id:
          type: [string, "null"]
          format: uuid
          description: Null means vendor-wide, covering every branch.

    BranchSummary:
      type: object
      properties:
        date: { type: string, format: date }
        scheduled: { type: integer }
        in_progress: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        unassigned: { type: integer }
        cash_held_minor:
          type: integer
          format: int64
          description: Cash this branch's drivers are carrying against today's work.
        payable_minor:
          type: integer
          format: int64
          description: Live from the ledger, not from the last statement.
        currency: { type: string }

    QueueItem:
      type: object
      properties:
        fulfillment_id: { type: string, format: uuid }
        order_no: { type: string }
        service_type: { type: string }
        kind: { type: string }
        status: { type: string }
        window: { type: string }
        recipient_name: { type: string }
        area: { type: string }
        items:
          type: string
          description: |
            Item names, which the driver's manifest deliberately does not carry.
            A kitchen needs them; a van does not.
        payload_ref:
          type: string
          description: |
            What the fulfillment carries for its own vertical to resolve — a meal
            slot, a bag count. Passed through as text rather than interpreted, so
            the console gains a new vertical's work for free even though it cannot
            pretty-print it.
        driver_name: { type: string }
        eta: { type: string, format: date-time }
        attempt_count: { type: integer }

    CapacityCell:
      type: object
      properties:
        date: { type: string, format: date }
        window_id: { type: string, format: uuid }
        window: { type: string }
        resource_key:
          type: string
          description: What is scarce here — pickup_slot, kitchen_covers, chair.
        capacity: { type: integer }
        reserved: { type: integer }
        consumed: { type: integer }
        remaining: { type: integer }

    RosterEntry:
      type: object
      properties:
        subscription_no: { type: string }
        customer_name: { type: string }
        meal_slot: { type: string }
        window: { type: string }
        area: { type: string }
        item: { type: string }
        status: { type: string }

    PayoutStatement:
      type: object
      description: |
        gross - commission - vat + adjustments = net, enforced by a database
        CHECK. A statement whose lines do not add up is the fastest way to lose a
        vendor's trust in every other number.
      properties:
        id: { type: string, format: uuid }
        reference_no: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        currency: { type: string }
        gross_minor: { type: integer, format: int64 }
        commission_minor: { type: integer, format: int64 }
        vat_minor: { type: integer, format: int64 }
        adjustments_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64 }
        state: { type: string, enum: [draft, issued, paid, disputed, cancelled] }
        issued_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }

    StatementLine:
      type: object
      properties:
        occurred_on: { type: string, format: date }
        kind:
          type: string
          description: |
            `cod_offset` is cash a driver collected on the vendor's behalf. It is
            already in their payable — the platform never received it — so it is
            deducted, otherwise the vendor is paid twice for one order: once at
            the door and once in the payout.
          enum: [order, subscription, refund, adjustment, cod_offset, penalty]
        description: { type: string }
        journal_id:
          type: string
          format: uuid
          description: The ledger journal behind this line. What makes a number answerable rather than re-derivable.
        reference_type: { type: string }
        reference_id: { type: string, format: uuid }
        gross_minor: { type: integer, format: int64 }
        commission_minor: { type: integer, format: int64 }
        vat_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64 }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference_no: { type: string }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        kind: { type: string }
        state:
          type: string
          enum: [open, investigating, awaiting_response, resolved, rejected, withdrawn]
        due_at: { type: string, format: date-time }
        assigned_to: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        overdue: { type: boolean }
