name: b2c-marketplace

services:
  postgres:
    # PostGIS is required from migration 000001 — plain postgres will not boot the schema.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
      # C collation keeps index behaviour identical across dev machines and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for presigned uploads (Phase 2 media pipeline).
  # Present from Phase 0 so the upload seam has somewhere to point in dev.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the media bucket and exits. Without it the first presigned upload
  # succeeds at signing and fails at PUT with NoSuchBucket, which reads as a
  # credentials problem and is not one.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/marketplace-media &&
      mc anonymous set download local/marketplace-media
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Indexed from Phase 2, served from in Phase 4 — see
  # docs/PHASE-2-MEDIA-AND-FEED.md §4.4. Behind a profile because it is a JVM
  # that nobody needs running to work on the order path:
  #   docker compose --profile search up -d
  opensearch:
    profiles: ["search"]
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      # Single-node dev only. Never carry either of these into a deployment.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:
