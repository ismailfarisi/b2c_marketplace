name: b2c-marketplace

services:
  postgres:
    # PostGIS is required from migration 000001 — plain postgres will not boot the schema.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
      # C collation keeps index behaviour identical across dev machines and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for presigned uploads (Phase 2 media pipeline).
  # Present from Phase 0 so the upload seam has somewhere to point in dev.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the media bucket and exits. Without it the first presigned upload
  # succeeds at signing and fails at PUT with NoSuchBucket, which reads as a
  # credentials problem and is not one.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/marketplace-media &&
      mc anonymous set download local/marketplace-media
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        CMD: api
    environment:
      APP_ENV: "development"
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SIGNING_KEY: "dev-only-do-not-use-in-any-deployed-environment"
      OTP_DEV_ECHO: "true"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
      S3_BUCKET: "marketplace-media"
      S3_FORCE_PATH_STYLE: "true"
      MEDIA_CDN_BASE_URL: "http://minio:9000/marketplace-media"
      TRANSCODE_VENDOR: "stub"
      FFPROBE_BINARY: "stub"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:80"]
    depends_on:
      - gateway

  # Indexed from Phase 2, served from in Phase 4 — see
  # docs/PHASE-2-MEDIA-AND-FEED.md §4.4. Behind a profile because it is a JVM
  # that nobody needs running to work on the order path:
  #   docker compose --profile search up -d
  opensearch:
    profiles: ["search"]
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      # Single-node dev only. Never carry either of these into a deployment.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # The analytics warehouse (Phase 4). PLAN-VIDEO-FIRST §3: view and impression
  # events go here and never to Postgres — "this is your highest-volume data by
  # an order of magnitude".
  #
  # Behind a profile for the same reason as OpenSearch: nothing on the order
  # path or the feed read path needs it running, and the Postgres event sink is
  # the correct destination in development and in a launch district.
  #   docker compose --profile analytics up -d
  #   make clickhouse-schema
  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: marketplace
      CLICKHOUSE_PASSWORD: marketplace
      CLICKHOUSE_DB: analytics
      # Single-node dev only.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9010:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:
  clickhousedata:
