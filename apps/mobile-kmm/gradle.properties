org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Hierarchical source sets. Without this an iosMain shared between arm64 and
# simulator arm64 does not exist and every actual has to be written twice.
kotlin.mpp.enableCInteropCommonization=true

# The iOS framework is static.
#
# A dynamic framework has to be embedded and signed as a separate step and adds
# a dlopen to app launch; a static one is linked in. For a shared module that is
# pure Kotlin with no resources, static is the smaller and faster answer, and the
# reason to choose dynamic — hot-swapping the framework without relinking — is
# not a workflow this project has.
kotlin.native.binary.freezing=disabled
